<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teaching Board | WeekendClasses</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="lab-layout.css">
<style>
  #library { flex: 1; min-height: 0; overflow: auto; padding: 24px 20px 48px; }
  .library-inner { max-width: 960px; margin: 0 auto; }
  .library-inner h2 { font-size: 1.5rem; overflow-wrap: anywhere; }
  #library-summary { color: var(--muted); margin: 6px 0 16px; }
  #library-problem { color: var(--error); font-weight: 600; margin: 0 0 14px; }
  .library-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .library-actions .btn { padding: 8px 16px; }
  .canvas-item { display: grid; gap: 6px; }
  .canvas-item-actions { display: flex; gap: 12px; padding-left: 4px; }
  .text-button { background: none; border: 0; padding: 0; font: inherit; font-size: .84rem; color: var(--primary); text-decoration: underline; cursor: pointer; }
  .topic-name, .topic-card { overflow-wrap: anywhere; }
  .topbar-links { display: flex; gap: 16px; }
  #save-status { position: absolute; left: 10px; bottom: 54px; padding: 3px 8px; background: #fff; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font-size: .78rem; }
  #stage.tools-hidden #save-status, #stage.tools-hidden .handwriting, #stage.tools-hidden #options-dot, #stage.tools-hidden #board-options { display: none; }
  .handwriting { position: absolute; right: 38px; bottom: 10px; max-width: calc(100% - 200px); display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; }
  #hand-toggle { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; background: none; border: 0; border-radius: 6px; color: var(--ink); font: 600 .8rem system-ui, sans-serif; white-space: nowrap; cursor: pointer; }
  #hand-toggle:hover { background: var(--page); }
  .switch-track { position: relative; width: 30px; height: 16px; border-radius: 99px; background: #a9bcba; }
  .switch-track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
  #hand-toggle[aria-checked="true"] .switch-track { background: var(--primary); }
  #hand-toggle[aria-checked="true"] .switch-track::after { left: 16px; }
  #hand-status { margin: 0; padding: 3px 8px; background: #fff; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font-size: .78rem; }
  /* The message can sit over the board, so clicks pass through it to the drawing. */
  #hand-status { pointer-events: none; }
  #hand-status:empty { display: none; }
  #convert-selected { height: 32px; padding: 0 10px; font-size: .8rem; white-space: nowrap; }
  .notice-button { margin-left: 10px; padding: 2px 8px; font: inherit; font-size: .84rem; cursor: pointer; }
  .menu-button { position: absolute; top: 10px; left: 10px; width: 44px; height: 44px; display: grid; place-items: center; padding: 0; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 2px 10px rgba(7, 57, 60, .14); color: var(--ink); cursor: pointer; }
  .menu-button:hover, .menu-button[aria-expanded="true"] { background: var(--primary-tint); color: var(--primary); }
  .menu-button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .board-menu { position: absolute; top: 62px; left: 10px; width: 260px; max-width: calc(100% - 20px); max-height: calc(100% - 72px); overflow: auto; display: grid; gap: 10px; padding: 14px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(7, 57, 60, .22); }
  .board-menu h1 { font-size: 1.05rem; color: var(--ink); }
  .board-menu label { display: block; margin-bottom: 4px; font-size: .84rem; font-weight: 600; }
  .menu-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .board-menu .btn { padding: 8px 6px; font-size: .86rem; }
  .board-menu a { font-size: .86rem; }
  #board-notice { flex: none; margin: 0; padding: 8px 20px; background: #fef3d7; color: #6b4300; font-size: .88rem; font-weight: 600; }

  body { user-select: none; -webkit-user-select: none; }
  #text-input { user-select: text; -webkit-user-select: text; }
  @font-face { font-family: Caveat; font-weight: 400; font-display: swap; src: url("vendor/caveat/caveat-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: Caveat; font-weight: 700; font-display: swap; src: url("vendor/caveat/caveat-latin-700-normal.woff2") format("woff2"); }
  #stage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #live { touch-action: none; cursor: crosshair; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #live[data-tool="select"] { cursor: default; }
  #live[data-tool="hand"], #live.panning { cursor: grab; }
  #live[data-tool="text"] { cursor: text; }

  .tools { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 16px); display: flex; align-items: center; gap: 2px; padding: 4px;
    background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 2px 10px rgba(7, 57, 60, .14); overflow-x: auto; }
  .tools button { flex: none; width: 36px; height: 36px; display: grid; place-items: center; padding: 0; background: none; border: 0; border-radius: 6px; color: var(--ink); font: 600 .78rem system-ui, sans-serif; cursor: pointer; }
  .tools button:hover { background: var(--page); }
  .tools button[aria-pressed="true"] { background: var(--primary-tint); color: var(--primary); }
  .tools button[disabled] { opacity: .35; cursor: default; }
  .tools svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tools .swatch { width: 18px; height: 18px; border-radius: 50%; background: var(--swatch); box-shadow: inset 0 0 0 1px rgba(16, 40, 43, .3); }
  .tools .swatch-rainbow { background: conic-gradient(#d92d20, #f97316, #eab308, #079455, #1570ef, #7c3aed, #db2777, #d92d20); }
  #color-panel { position: absolute; top: 62px; width: 208px; padding: 10px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(7, 57, 60, .22); }
  #color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  #color-grid button { width: 30px; height: 30px; padding: 0; justify-self: center; border: 1px solid rgba(16, 40, 43, .3); border-radius: 50%; cursor: pointer; }
  #color-grid button[aria-pressed="true"] { outline: 2px solid var(--primary); outline-offset: 2px; }
  #color-custom-label { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--ink); font-size: .82rem; font-weight: 600; cursor: pointer; }
  #color-custom { width: 44px; height: 28px; padding: 0; border: 1px solid #a9bcba; border-radius: 6px; background: #fff; cursor: pointer; }
  #stage.tools-hidden #color-panel { display: none; }
  .tools .gap { flex: none; width: 1px; height: 22px; margin: 0 4px; background: var(--line); }
  .tools .dot { border-radius: 50%; background: currentColor; }

  .zoom { position: absolute; left: 10px; bottom: 10px; display: flex; align-items: center; gap: 2px; padding: 3px; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  .zoom button { min-width: 32px; height: 30px; padding: 0 6px; background: none; border: 0; border-radius: 6px; color: var(--ink); font: 600 .84rem system-ui, sans-serif; cursor: pointer; }
  .zoom button:hover { background: var(--page); }

  /* The visible dot is tiny, while the button around it stays easy to click. */
  #options-dot { position: absolute; right: 6px; bottom: 6px; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; background: none; border: 0; border-radius: 50%; cursor: pointer; }
  #options-dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #8fa5a2; box-shadow: 0 0 0 1px rgba(255, 255, 255, .7); }
  #options-dot:hover::after, #options-dot[aria-expanded="true"]::after { background: var(--primary); }
  #board-options { position: absolute; right: 10px; bottom: 38px; display: grid; justify-items: end; gap: 6px; padding: 8px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(7, 57, 60, .22); }
  .backgrounds { display: flex; gap: 2px; }
  .backgrounds button { height: 30px; padding: 0 8px; background: none; border: 0; border-radius: 6px; color: var(--ink); font: 600 .8rem system-ui, sans-serif; cursor: pointer; }
  .backgrounds button:hover { background: var(--page); }
  .backgrounds button[aria-pressed="true"] { background: var(--primary-tint); color: var(--primary); }

  #text-input { position: absolute; margin: -1px; padding: 0; min-width: 1.5em; min-height: 1.25em; border: 1px dashed var(--primary); outline: 0; background: transparent; white-space: pre; line-height: 1.25; font-family: system-ui, sans-serif; cursor: text; }
  #text-input ul { margin: 0; padding: 0 0 0 1.2em; }
  #text-format { position: absolute; display: flex; align-items: center; gap: 2px; padding: 3px; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 2px 10px rgba(7, 57, 60, .18); }
  #text-format button { white-space: nowrap; min-width: 32px; height: 30px; padding: 0 6px; background: none; border: 0; border-radius: 6px; color: var(--ink); font: 700 .9rem system-ui, sans-serif; cursor: pointer; }
  #text-format button:hover { background: var(--page); }
  #text-format button[aria-pressed="true"] { background: var(--primary-tint); color: var(--primary); }
  #text-format .format-hint { padding: 0 6px; color: var(--muted); font-size: .76rem; white-space: nowrap; }
  #format-size { min-width: 26px; text-align: center; color: var(--ink); font: 600 .84rem system-ui, sans-serif; }
  #text-format .format-gap { width: 1px; height: 20px; margin: 0 3px; background: var(--line); }
  #stage.tools-hidden #text-format { display: none; }

  #stage.tools-hidden .tools, #stage.tools-hidden .menu-button, #stage.tools-hidden .board-menu, #stage.tools-hidden .zoom { display: none; }
  #tools-hint { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 6px 12px; background: rgba(16, 40, 43, .88); color: #fff; border-radius: 6px; font-size: .84rem; white-space: nowrap; pointer-events: none; }

  /* Below this width the centred toolbar would run under the menu button. */
  @media (max-width: 1000px) {
    .tools { left: 62px; max-width: calc(100% - 70px); transform: none; }
  }
  @media (max-width: 640px) {
    /* Phones have no Ctrl+. to bring hidden tools back. */
    #present, #hide-tools, #text-format .format-hint { display: none; }
    .handwriting { right: 10px; bottom: 80px; max-width: calc(100% - 20px); }
  }
</style>
</head>
<body>

<header class="topbar" id="library-bar" hidden>
  <div class="wrap">
    <h1>Teaching Boards</h1>
    <div class="topbar-links"><a href="admin.html">Admin page</a></div>
  </div>
</header>
<p id="board-notice" role="alert" hidden></p>

<main id="library" hidden>
  <div class="library-inner">
    <div class="library-actions" id="library-back-row" hidden>
      <button class="btn secondary" id="library-back" type="button">All folders</button>
    </div>
    <h2 id="library-title" tabindex="-1"></h2>
    <p id="library-summary" aria-live="polite"></p>
    <p id="library-problem" role="alert" hidden></p>
    <div class="library-actions" id="library-actions"></div>
    <ol class="card-list" id="library-list"></ol>
  </div>
</main>

<main id="stage" hidden>
  <input type="file" id="image-file" accept="image/*" hidden>
  <canvas id="base" aria-hidden="true"></canvas>
  <canvas id="live" role="img" aria-label="Drawing board"></canvas>
  <div class="tools" id="tools" role="toolbar" aria-label="Drawing tools"></div>
  <button class="menu-button" id="menu-button" type="button" aria-label="Menu" title="Menu" aria-expanded="false" aria-controls="board-menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="board-menu" id="board-menu" hidden>
    <h1 id="canvas-name"></h1>
    <button class="btn secondary" id="to-folder" type="button">Back to folder</button>
    <button class="btn secondary" id="rename-board" type="button">Rename canvas</button>
    <button class="btn secondary" id="export" type="button">Export image</button>
    <button class="btn secondary" id="hide-tools" type="button">Hide tools (Ctrl+.)</button>
    <button class="btn" id="present" type="button">Full screen</button>
    <a href="admin.html">Admin page</a>
  </div>
  <div class="zoom">
    <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
    <button id="zoom-reset" type="button" title="Reset zoom (0)">100%</button>
    <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
  </div>
  <div id="color-panel" role="group" aria-label="More colours" hidden>
    <div id="color-grid"></div>
    <label id="color-custom-label">Custom colour <input type="color" id="color-custom" value="#1570ef"></label>
  </div>
  <div id="text-format" role="toolbar" aria-label="Text formatting" hidden>
    <button id="format-bold" type="button" title="Bold (Ctrl+B)" aria-label="Bold" aria-pressed="false">B</button>
    <button id="format-italic" type="button" title="Italic (Ctrl+I)" aria-label="Italic" aria-pressed="false"><i>I</i></button>
    <button id="format-bullets" type="button" title="Bullet points (Ctrl+Shift+8)" aria-label="Bullet points" aria-pressed="false">• List</button>
    <span class="format-gap"></span>
    <button id="format-smaller" type="button" title="Smaller text (Ctrl+Shift+,)" aria-label="Smaller text">A−</button>
    <span id="format-size" aria-live="polite"></span>
    <button id="format-bigger" type="button" title="Bigger text (Ctrl+Shift+.)" aria-label="Bigger text">A+</button>
    <span class="format-hint">Click outside or press Esc to finish</span>
  </div>
  <p id="save-status" role="status"></p>
  <div class="handwriting">
    <p id="hand-status" role="status"></p>
    <button class="btn" id="convert-selected" type="button" hidden>Convert to text</button>
  </div>
  <button id="options-dot" type="button" title="Board options" aria-label="Board options" aria-expanded="false" aria-controls="board-options"></button>
  <div id="board-options" hidden>
    <button id="hand-toggle" type="button" role="switch" aria-checked="false" title="Lets you turn chosen pen writing into typed text. Images of the writing you choose go to Google Gemini.">
      <span class="switch-track" aria-hidden="true"></span>
      <span id="hand-toggle-label">Handwriting to text: Off</span>
    </button>
    <div class="backgrounds" id="backgrounds" role="group" aria-label="Board background"></div>
  </div>
  <p id="tools-hint" role="status" hidden>Press Ctrl+. to show the tools</p>
</main>

<script src="config.js"></script>
<script src="student-api.js"></script>
<script src="admin-api.js"></script>
<script src="progress-ring.js"></script>
<script>
// The drawings themselves are protected by the backend, which checks this login on every request.
if (!getAdminToken()) location.replace("admin.html");

const element = (id) => document.getElementById(id);
const baseCanvas = element("base");
const liveCanvas = element("live");
const baseContext = baseCanvas.getContext("2d", { alpha: false });
const liveContext = liveCanvas.getContext("2d");

const TOOLS = [
  { id: "select", label: "Select and move", key: "v", icon: '<path d="M5 3l14 8-6 2-3 6z"/>' },
  { id: "hand", label: "Move the board", key: "h", icon: '<path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/>' },
  { id: "pen", label: "Pen", key: "p", icon: '<path d="M4 20l1-5L16 4l4 4L9 19z"/>' },
  { id: "line", label: "Line", key: "l", icon: '<path d="M5 19L19 5"/>' },
  { id: "arrow", label: "Arrow", key: "a", icon: '<path d="M5 19L19 5M10 5h9v9"/>' },
  { id: "rect", label: "Rectangle", key: "r", icon: '<rect x="4" y="6" width="16" height="12" rx="1"/>' },
  { id: "ellipse", label: "Circle", key: "o", icon: '<ellipse cx="12" cy="12" rx="9" ry="7"/>' },
  { id: "text", label: "Text", key: "t", icon: '<path d="M5 6V4h14v2M12 4v16M9 20h6"/>' },
  { id: "eraser", label: "Eraser", key: "e", icon: '<path d="M8 20l-5-5L14 4l7 7-9 9zM8 20h13"/>' },
  { id: "convert", label: "Convert handwriting: drag a box around your words", key: "c", icon: '<path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M9 9h6M12 9v7"/>' },
];
// Colours are stored by name, so a drawing stays readable when its background changes.
const COLORS = [["Default ink", "ink"], ["Red", "red"], ["Blue", "blue"], ["Green", "green"]];
const LIGHT_PAINT = { ink: "#1e1e1e", red: "#d92d20", blue: "#1570ef", green: "#079455", yellow: "#eab308", orange: "#f97316", purple: "#7c3aed", pink: "#db2777", teal: "#0d9488", brown: "#92400e", gray: "#6b7280", selection: "#0f766e" };
const DARK_PAINT = { ink: "#ffffff", red: "#ff6b60", blue: "#5eaeff", green: "#3ddc97", yellow: "#facc15", orange: "#fb923c", purple: "#a78bfa", pink: "#f472b6", teal: "#2dd4bf", brown: "#d6a77a", gray: "#9ca3af", selection: "#2dd4bf" };
// Named colours adjust to the background. Black, white and custom colours stay exactly as chosen.
const MORE_COLORS = [["Red", "red"], ["Yellow", "yellow"], ["Blue", "blue"], ["Green", "green"], ["Orange", "orange"], ["Purple", "purple"], ["Pink", "pink"], ["Teal", "teal"], ["Brown", "brown"], ["Gray", "gray"], ["Black", "#000000"], ["White", "#ffffff"]];
const BACKGROUNDS = {
  white: { label: "White", fill: "#ffffff", paint: LIGHT_PAINT },
  dark: { label: "Dark", fill: "#1e1e1e", paint: DARK_PAINT },
  black: { label: "Black", fill: "#000000", paint: DARK_PAINT },
};
const SIZES = [["Thin", 2, 20, 6], ["Medium", 4, 28, 10], ["Thick", 8, 44, 15]];
const SHAPE_TOOLS = ["line", "arrow", "rect", "ellipse"];
const MIN_ZOOM = 0.1;
const MAX_ZOOM = 8;
const ZOOM_EASE_MS = 90;
const ZOOM_STOP_DISTANCE = 0.002;
const WHEEL_ZOOM_SPEED = 0.006;
const MAX_WHEEL_STEP = 40;
const BUTTON_ZOOM_STEP = 1.25;
// Boards fuller than this zoom a saved picture of themselves, then redraw sharply when the zoom stops.
const PICTURE_ZOOM_SHAPES = 300;
const MAX_SELECTION_BOXES = 100;
const PALM_GUARD_MS = 800;
const DOUBLE_TAP_MS = 400;
const MIN_TEXT_SIZE = 10;
const MAX_TEXT_SIZE = 240;
const TEXT_SIZE_STEP = 1.2;
const MIN_IMAGE_SIZE = 20;
const HANDLE_SIZE = 10;
const HANDLE_REACH = 10;
const TOUCH_HANDLE_REACH = 22;
// Canvases save to the Google Sheet, which holds about 4 million characters each, so images are kept small.
const MAX_IMAGE_SIDE = 1600;
const MAX_IMAGE_FILE_BYTES = 25 * 1024 * 1024;
const MAX_KEPT_PNG_LENGTH = 300000;
const MAX_IMAGE_LENGTH = 800000;
const MAX_CANVAS_IMAGES_LENGTH = 3000000;
const IMAGE_QUALITY = 0.82;
const IMAGE_SHRINK = 0.75;
const NEW_IMAGE_SCREEN_SHARE = 0.5;
const LOCKED_COLOR = "#f59e0b";
const HINT_MS = 2500;
const MAX_UNDO = 200;
const SAVE_DELAY_MS = 300;
const HIT_TOLERANCE = 8;
const EXPORT_PADDING = 40;
const MAX_EXPORT_SIZE = 8000;
const FONT = "system-ui, sans-serif";
const LINE_HEIGHT = 1.25;
const HAND_FONT = "Caveat, cursive";
const HAND_KEY = "board-handwriting";
const HAND_IMAGE_HEIGHT = 96;
const HAND_MAX_IMAGE_WIDTH = 2048;
const HAND_INK_WIDTH = 3;
const HAND_FONT_SCALE = 0.85;
const HAND_MIN_FONT = 18;
const HAND_MAX_FONT = 160;
const HAND_WORD_GAP = 2;
const HAND_NOTE_MS = 4000;
const HAND_READING_OPACITY = 0.35;
const WORKER_PASS_MARGIN_MS = 60000;
const BULLET_INDENT = 1.2;
const BULLET_MARK_OFFSET = 0.45;
const SYNC_DELAY_MS = 3000;
const SYNC_RETRY_MS = 30000;
const DB_NAME = "weekend-board";
const STORE = "boards";

// A board is a list of shapes that are never changed in place, so undo only has to keep old lists.
let shapes = [];
let undoStack = [];
let redoStack = [];
let view = { x: 0, y: 0, zoom: 1 };
let tool = "pen";
let color = COLORS[0][1];
let background = "white";
let zoomAnimation = null;
const touches = new Map();
// Once a pencil has been used, a single touch is treated as a resting palm and never draws.
let penSeen = false;
let lastPenAt = -Infinity;
let lastTap = { time: -Infinity, shape: null };
// The size last chosen in the text box, used for the next new text until the thickness changes.
let chosenTextSize = null;
const loadedImages = new Map();
let sizeIndex = 0;
let selected = [];
let gesture = null;
let spaceHeld = false;
let textEditor = null;
let redrawQueued = false;
let pixelRatio = 1;

let database = null;
const memoryBoards = new Map();
let currentBoard = null;
let saveTimer = null;
let savePending = false;
let syncTimer = null;
let syncRunning = false;
let unsyncedCount = 0;
let sessionEnded = false;
let library = { folders: [], boards: [] };
// Only the newest navigation may draw the page, in case an earlier request finishes later.
let latestRoute = 0;

/* Drawing */

const shapeBounds = new WeakMap();

function boundsOf(shape) {
  let bounds = shapeBounds.get(shape);
  if (bounds) return bounds;
  const { points, type } = shape;
  if (type === "text") {
    bounds = [points[0], points[1], points[0] + shape.width, points[1] + shape.height];
  } else {
    bounds = [Infinity, Infinity, -Infinity, -Infinity];
    for (let index = 0; index < points.length; index += 2) {
      bounds[0] = Math.min(bounds[0], points[index]);
      bounds[1] = Math.min(bounds[1], points[index + 1]);
      bounds[2] = Math.max(bounds[2], points[index]);
      bounds[3] = Math.max(bounds[3], points[index + 1]);
    }
    const margin = shape.size * (type === "arrow" ? 4 : 1);
    bounds = [bounds[0] - margin, bounds[1] - margin, bounds[2] + margin, bounds[3] + margin];
  }
  shapeBounds.set(shape, bounds);
  return bounds;
}

function tracePen(context, points) {
  context.moveTo(points[0], points[1]);
  // Curving through the midpoints keeps fast strokes smooth.
  for (let index = 2; index < points.length - 2; index += 2) {
    context.quadraticCurveTo(points[index], points[index + 1], (points[index] + points[index + 2]) / 2, (points[index + 1] + points[index + 3]) / 2);
  }
  context.lineTo(points[points.length - 2], points[points.length - 1]);
}

function paintFor(name) {
  const paint = BACKGROUNDS[background].paint;
  return paint[name] || (/^#[0-9a-f]{6}$/i.test(name) ? name : paint.ink);
}

function imageFor(src) {
  let image = loadedImages.get(src);
  if (!image && src.startsWith("data:image/")) {
    image = new Image();
    image.onload = requestRender;
    image.src = src;
    loadedImages.set(src, image);
  }
  return image;
}

function drawShape(context, shape) {
  const { type, points } = shape;
  if (type === "image") {
    const image = imageFor(shape.src);
    if (image?.complete && image.naturalWidth) context.drawImage(image, points[0], points[1], points[2] - points[0], points[3] - points[1]);
    return;
  }
  const paint = paintFor(shape.color);
  context.strokeStyle = paint;
  context.fillStyle = paint;
  context.lineWidth = shape.size;
  context.lineCap = "round";
  context.lineJoin = "round";
  if (type === "text") {
    drawTextShape(context, shape);
    return;
  }
  context.beginPath();
  if (type === "pen") {
    if (points.length === 2) {
      context.arc(points[0], points[1], shape.size / 2, 0, Math.PI * 2);
      context.fill();
      return;
    }
    tracePen(context, points);
  } else if (type === "rect") {
    context.rect(points[0], points[1], points[2] - points[0], points[3] - points[1]);
  } else if (type === "ellipse") {
    context.ellipse((points[0] + points[2]) / 2, (points[1] + points[3]) / 2, Math.abs(points[2] - points[0]) / 2, Math.abs(points[3] - points[1]) / 2, 0, 0, Math.PI * 2);
  } else {
    context.moveTo(points[0], points[1]);
    context.lineTo(points[2], points[3]);
    if (type === "arrow") {
      const angle = Math.atan2(points[3] - points[1], points[2] - points[0]);
      const head = Math.max(12, shape.size * 4);
      for (const side of [-0.45, 0.45]) {
        context.moveTo(points[2], points[3]);
        context.lineTo(points[2] - head * Math.cos(angle + side), points[3] - head * Math.sin(angle + side));
      }
    }
  }
  context.stroke();
}

function applyView(context) {
  context.setTransform(pixelRatio * view.zoom, 0, 0, pixelRatio * view.zoom, pixelRatio * view.x, pixelRatio * view.y);
}

function fillBackground() {
  baseContext.setTransform(1, 0, 0, 1, 0, 0);
  baseContext.fillStyle = BACKGROUNDS[background].fill;
  baseContext.fillRect(0, 0, baseCanvas.width, baseCanvas.height);
}

function renderBase(skip = null) {
  fillBackground();
  applyView(baseContext);
  const left = -view.x / view.zoom;
  const top = -view.y / view.zoom;
  const right = left + liveCanvas.clientWidth / view.zoom;
  const bottom = top + liveCanvas.clientHeight / view.zoom;
  for (const shape of shapes) {
    if (skip && skip.has(shape)) continue;
    // Skipping what's off screen keeps moving around fast on a very full board.
    const bounds = boundsOf(shape);
    if (bounds[2] < left || bounds[0] > right || bounds[3] < top || bounds[1] > bottom) continue;
    baseContext.globalAlpha = readingStrokes.has(shape) ? HAND_READING_OPACITY : 1;
    drawShape(baseContext, shape);
  }
  baseContext.globalAlpha = 1;
}

function clearLive() {
  liveContext.setTransform(1, 0, 0, 1, 0, 0);
  liveContext.clearRect(0, 0, liveCanvas.width, liveCanvas.height);
  applyView(liveContext);
}

function unionBounds(list) {
  const all = list.map(boundsOf);
  return [
    Math.min(...all.map((bounds) => bounds[0])),
    Math.min(...all.map((bounds) => bounds[1])),
    Math.max(...all.map((bounds) => bounds[2])),
    Math.max(...all.map((bounds) => bounds[3])),
  ];
}

function drawBox([left, top, right, bottom], strokeColor) {
  liveContext.save();
  liveContext.strokeStyle = strokeColor;
  liveContext.lineWidth = 1.5 / view.zoom;
  liveContext.setLineDash([6 / view.zoom, 4 / view.zoom]);
  liveContext.strokeRect(left - 4, top - 4, right - left + 8, bottom - top + 8);
  liveContext.restore();
}

function isResizable(shape) {
  return (shape.type === "image" || shape.type === "text") && !shape.locked;
}

function handleCorners(shape) {
  const [left, top, right, bottom] = boundsOf(shape);
  return [[left - 4, top - 4], [right + 4, top - 4], [left - 4, bottom + 4], [right + 4, bottom + 4]];
}

function drawHandles(shape) {
  const size = HANDLE_SIZE / view.zoom;
  liveContext.save();
  liveContext.fillStyle = "#fff";
  liveContext.strokeStyle = BACKGROUNDS[background].paint.selection;
  liveContext.lineWidth = 1.5 / view.zoom;
  for (const [x, y] of handleCorners(shape)) {
    liveContext.fillRect(x - size / 2, y - size / 2, size, size);
    liveContext.strokeRect(x - size / 2, y - size / 2, size, size);
  }
  liveContext.restore();
}

function drawSelection(list) {
  const paint = BACKGROUNDS[background].paint.selection;
  if (list.length === 1 && isResizable(list[0]) && tool === "select") {
    drawBox(boundsOf(list[0]), paint);
    drawHandles(list[0]);
    return;
  }
  // One box around a very large selection is quicker, and easier to read, than hundreds of boxes.
  if (list.length > MAX_SELECTION_BOXES) return drawBox(unionBounds(list), paint);
  for (const shape of list) drawBox(boundsOf(shape), shape.locked ? LOCKED_COLOR : paint);
}

function renderLive() {
  clearLive();
  if (selected.length && !gesture) drawSelection(selected);
}

function showZoomLevel() {
  element("zoom-reset").textContent = `${Math.round(view.zoom * 100)}%`;
}

function renderAll() {
  renderBase();
  renderLive();
  showZoomLevel();
}

function requestRender() {
  if (redrawQueued) return;
  redrawQueued = true;
  requestAnimationFrame(() => {
    redrawQueued = false;
    renderAll();
  });
}

function resizeCanvases() {
  pixelRatio = window.devicePixelRatio || 1;
  for (const canvas of [baseCanvas, liveCanvas]) {
    canvas.width = Math.round(canvas.clientWidth * pixelRatio);
    canvas.height = Math.round(canvas.clientHeight * pixelRatio);
  }
  renderAll();
}

/* Finding shapes under the pointer */

function distanceToSegment(x, y, x1, y1, x2, y2) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const lengthSquared = dx * dx + dy * dy;
  const position = lengthSquared ? Math.max(0, Math.min(1, ((x - x1) * dx + (y - y1) * dy) / lengthSquared)) : 0;
  return Math.hypot(x - x1 - position * dx, y - y1 - position * dy);
}

function isNearShape(shape, x, y, tolerance) {
  const { type, points } = shape;
  const [left, top, right, bottom] = boundsOf(shape);
  if (x < left - tolerance || x > right + tolerance || y < top - tolerance || y > bottom + tolerance) return false;
  const reach = tolerance + shape.size / 2;
  if (type === "text" || type === "image") return true;
  if (type === "pen") {
    if (points.length === 2) return Math.hypot(x - points[0], y - points[1]) <= reach;
    for (let index = 0; index < points.length - 2; index += 2) {
      if (distanceToSegment(x, y, points[index], points[index + 1], points[index + 2], points[index + 3]) <= reach) return true;
    }
    return false;
  }
  if (type === "line" || type === "arrow") return distanceToSegment(x, y, points[0], points[1], points[2], points[3]) <= reach;
  if (type === "rect") {
    const [x1, y1, x2, y2] = points;
    return [[x1, y1, x2, y1], [x2, y1, x2, y2], [x2, y2, x1, y2], [x1, y2, x1, y1]]
      .some((edge) => distanceToSegment(x, y, ...edge) <= reach);
  }
  const radiusX = Math.max(Math.abs(points[2] - points[0]) / 2, 1);
  const radiusY = Math.max(Math.abs(points[3] - points[1]) / 2, 1);
  const scaled = Math.hypot((x - (points[0] + points[2]) / 2) / radiusX, (y - (points[1] + points[3]) / 2) / radiusY);
  return Math.abs(scaled - 1) * Math.min(radiusX, radiusY) <= reach;
}

function unlockedShapeAt(x, y, skipImages = false) {
  const tolerance = HIT_TOLERANCE / view.zoom;
  for (let index = shapes.length - 1; index >= 0; index--) {
    const shape = shapes[index];
    if (shape.locked || (skipImages && shape.type === "image")) continue;
    if (isNearShape(shape, x, y, tolerance)) return shape;
  }
  return null;
}

function resizeCornerAt(x, y, pointerType) {
  if (selected.length !== 1 || !isResizable(selected[0])) return -1;
  const exact = HANDLE_REACH / view.zoom;
  const [left, top, right, bottom] = boundsOf(selected[0]);
  const outside = x < left || x > right || y < top || y > bottom;
  // A fingertip gets extra room, but only outside the shape, so small text can still be tapped and moved.
  const reach = pointerType !== "mouse" && outside ? TOUCH_HANDLE_REACH / view.zoom : exact;
  return handleCorners(selected[0]).findIndex(([cornerX, cornerY]) => Math.abs(x - cornerX) <= reach && Math.abs(y - cornerY) <= reach);
}

// Prefers unlocked shapes, so that what's drawn over locked content is easy to pick.
function shapeAt(x, y) {
  const unlocked = unlockedShapeAt(x, y);
  if (unlocked) return unlocked;
  const tolerance = HIT_TOLERANCE / view.zoom;
  for (let index = shapes.length - 1; index >= 0; index--) {
    if (isNearShape(shapes[index], x, y, tolerance)) return shapes[index];
  }
  return null;
}

/* Changing the board */

function commit(nextShapes) {
  undoStack.push(shapes);
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack = [];
  shapes = nextShapes;
  scheduleSave();
  updateControls();
}

function addShape(shape) {
  commit([...shapes, shape]);
  // Only the new shape needs drawing, so a very full board stays as fast as an empty one.
  applyView(baseContext);
  drawShape(baseContext, shape);
}

function undo() {
  if (!undoStack.length) return;
  redoStack.push(shapes);
  shapes = undoStack.pop();
  selected = [];
  scheduleSave();
  updateControls();
  renderAll();
}

function redo() {
  if (!redoStack.length) return;
  undoStack.push(shapes);
  shapes = redoStack.pop();
  selected = [];
  scheduleSave();
  updateControls();
  renderAll();
}

function deleteSelected() {
  const targets = new Set(selected.filter((shape) => !shape.locked));
  if (!targets.size) return;
  selected = selected.filter((shape) => shape.locked);
  commit(shapes.filter((shape) => !targets.has(shape)));
  renderAll();
}

// Locked shapes stay, so a lesson's prepared content survives clearing what was drawn over it.
function clearBoard() {
  if (shapes.every((shape) => shape.locked)) return;
  selected = selected.filter((shape) => shape.locked);
  commit(shapes.filter((shape) => shape.locked));
  renderAll();
}

function setSelection(list) {
  selected = list;
  renderLive();
  updateControls();
}

function selectAll() {
  closeTextEditor(true);
  setTool("select");
  setSelection(shapes.filter((shape) => !shape.locked));
}

function replaceShapes(targets, change) {
  const replaced = new Map([...targets].map((shape) => [shape, change(shape)]));
  selected = selected.map((shape) => replaced.get(shape) || shape);
  commit(shapes.map((shape) => replaced.get(shape) || shape));
}

function lockSelected() {
  const targets = selected.filter((shape) => !shape.locked);
  if (!targets.length) return;
  replaceShapes(targets, (shape) => ({ ...shape, locked: true }));
  renderLive();
}

// Unlocks the selected locked shapes, or every locked shape when none are selected.
function unlockShapes() {
  const chosen = selected.filter((shape) => shape.locked);
  const targets = chosen.length ? chosen : shapes.filter((shape) => shape.locked);
  if (!targets.length) return;
  replaceShapes(targets, ({ locked, ...shape }) => shape);
  renderLive();
}

/* Pointer input */

function toWorld(event) {
  const box = liveCanvas.getBoundingClientRect();
  return { x: (event.clientX - box.left - view.x) / view.zoom, y: (event.clientY - box.top - view.y) / view.zoom };
}

function roundPoint(value) {
  return Math.round(value * 10) / 10;
}

function drawPenSegment(points) {
  const count = points.length;
  liveContext.strokeStyle = paintFor(gesture.shape.color);
  liveContext.lineWidth = gesture.shape.size;
  liveContext.lineCap = "round";
  liveContext.lineJoin = "round";
  liveContext.beginPath();
  if (count < 6) {
    liveContext.moveTo(points[0], points[1]);
    liveContext.lineTo(points[count - 2], points[count - 1]);
  } else {
    // Draws only the newest piece of the stroke, so long strokes never slow down.
    liveContext.moveTo((points[count - 6] + points[count - 4]) / 2, (points[count - 5] + points[count - 3]) / 2);
    liveContext.quadraticCurveTo(points[count - 4], points[count - 3], (points[count - 4] + points[count - 2]) / 2, (points[count - 3] + points[count - 1]) / 2);
  }
  liveContext.stroke();
}

function eraseAt(x, y) {
  // Rubbing out writing on top of an image shouldn't remove the image, so images need Select and Delete.
  const hit = unlockedShapeAt(x, y, true);
  if (!hit) return;
  if (!gesture.erased) {
    gesture.erased = true;
    commit(shapes.filter((shape) => shape !== hit));
  } else {
    shapes = shapes.filter((shape) => shape !== hit);
    scheduleSave();
  }
  renderBase();
}

function startResize(corner, x, y) {
  const shape = selected[0];
  const [left, top, right, bottom] = boundsOf(shape);
  const towardsRight = corner % 2 === 1;
  const towardsBottom = corner >= 2;
  const anchorX = towardsRight ? left : right;
  const anchorY = towardsBottom ? top : bottom;
  gesture = { kind: "resize", shape, towardsRight, towardsBottom, anchorX, anchorY, startDistance: Math.max(Math.hypot(x - anchorX, y - anchorY), 1), resized: null };
  renderBase(new Set([shape]));
  clearLive();
  drawShape(liveContext, shape);
  drawSelection([shape]);
}

// Places a resized shape so that the corner opposite the dragged one stays still.
function resizedShape({ shape, towardsRight, towardsBottom, anchorX, anchorY, startDistance }, x, y) {
  const scale = Math.hypot(x - anchorX, y - anchorY) / startDistance;
  if (shape.type === "text") {
    const fontSize = Math.round(Math.min(MAX_TEXT_SIZE, Math.max(MIN_TEXT_SIZE, shape.fontSize * scale)));
    const size = measureLines(textLines(shape), fontSize, familyOf(shape));
    const left = towardsRight ? anchorX : anchorX - size.width;
    const top = towardsBottom ? anchorY : anchorY - size.height;
    return { ...shape, fontSize, ...size, points: [roundPoint(left), roundPoint(top)] };
  }
  const [startLeft, startTop, startRight, startBottom] = boundsOf(shape);
  const smallest = Math.min(startRight - startLeft, startBottom - startTop);
  const limited = Math.max(scale, MIN_IMAGE_SIZE / Math.max(smallest, 1));
  const width = (startRight - startLeft) * limited;
  const height = (startBottom - startTop) * limited;
  const left = towardsRight ? anchorX : anchorX - width;
  const top = towardsBottom ? anchorY : anchorY - height;
  return { ...shape, points: [roundPoint(left), roundPoint(top), roundPoint(left + width), roundPoint(top + height)] };
}

function startSelecting(x, y, adding) {
  const hit = shapeAt(x, y);
  if (!hit) {
    if (!adding) selected = [];
    gesture = { kind: "marquee", startX: x, startY: y, endX: x, endY: y, adding };
    clearLive();
    if (selected.length) drawSelection(selected);
  } else if (adding) {
    selected = selected.includes(hit) ? selected.filter((shape) => shape !== hit) : [...selected, hit];
    renderLive();
  } else {
    if (!selected.includes(hit)) selected = [hit];
    const moving = selected.filter((shape) => !shape.locked);
    // Locked shapes can be selected, so they can be unlocked, but they never move.
    if (moving.length) gesture = { kind: "move", moving, startX: x, startY: y, moved: false };
    renderLive();
  }
  updateControls();
}

function startGesture(event) {
  finishZoom();
  const { x, y } = toWorld(event);
  const activeTool = spaceHeld || event.button === 1 ? "hand" : tool;
  if (activeTool === "hand") {
    gesture = { kind: "pan", startX: event.clientX, startY: event.clientY, viewX: view.x, viewY: view.y };
    liveCanvas.classList.add("panning");
  } else if (activeTool === "pen") {
    gesture = { kind: "pen", shape: { type: "pen", color, size: SIZES[sizeIndex][1], points: [roundPoint(x), roundPoint(y)] } };
    clearLive();
    liveContext.fillStyle = paintFor(color);
    liveContext.beginPath();
    liveContext.arc(x, y, SIZES[sizeIndex][1] / 2, 0, Math.PI * 2);
    liveContext.fill();
  } else if (SHAPE_TOOLS.includes(activeTool)) {
    gesture = { kind: "shape", shape: { type: activeTool, color, size: SIZES[sizeIndex][1], points: [roundPoint(x), roundPoint(y), roundPoint(x), roundPoint(y)] } };
  } else if (activeTool === "eraser") {
    gesture = { kind: "erase", erased: false };
    selected = [];
    clearLive();
    eraseAt(x, y);
  } else if (activeTool === "convert") {
    gesture = { kind: "marquee", convert: true, startX: x, startY: y, endX: x, endY: y };
    clearLive();
  } else if (activeTool === "select") {
    const corner = resizeCornerAt(x, y, event.pointerType);
    if (corner !== -1) startResize(corner, x, y);
    else startSelecting(x, y, event.shiftKey);
  }
  if (!gesture) return;
  gesture.pointerId = event.pointerId;
  try {
    liveCanvas.setPointerCapture(event.pointerId);
  } catch (error) {
    // A very quick tap can already have ended, and its stroke is still kept when the pointer lifts.
  }
}

function continueGesture(event) {
  const { kind } = gesture;
  if (kind === "pan") {
    view.x = gesture.viewX + event.clientX - gesture.startX;
    view.y = gesture.viewY + event.clientY - gesture.startY;
    requestRender();
    return;
  }
  // Fast pen movement arrives as several points grouped into one event.
  const samples = event.getCoalescedEvents?.().length ? event.getCoalescedEvents() : [event];
  for (const sample of samples) {
    const { x, y } = toWorld(sample);
    if (kind === "pen") {
      const { points } = gesture.shape;
      if (Math.hypot(x - points[points.length - 2], y - points[points.length - 1]) < 1 / view.zoom) continue;
      points.push(roundPoint(x), roundPoint(y));
      drawPenSegment(points);
    } else if (kind === "erase") {
      eraseAt(x, y);
    }
  }
  const { x, y } = toWorld(event);
  if (kind === "shape") {
    gesture.shape.points[2] = roundPoint(x);
    gesture.shape.points[3] = roundPoint(y);
    clearLive();
    drawShape(liveContext, gesture.shape);
  } else if (kind === "move") {
    if (!gesture.moved) {
      gesture.moved = true;
      renderBase(new Set(gesture.moving));
    }
    clearLive();
    const moved = gesture.moving.map((shape) => translated(shape, x - gesture.startX, y - gesture.startY));
    moved.forEach((shape) => drawShape(liveContext, shape));
    drawSelection(moved);
  } else if (kind === "resize") {
    gesture.resized = resizedShape(gesture, x, y);
    clearLive();
    drawShape(liveContext, gesture.resized);
    drawSelection([gesture.resized]);
  } else if (kind === "marquee") {
    gesture.endX = x;
    gesture.endY = y;
    clearLive();
    if (selected.length) drawSelection(selected);
    liveContext.save();
    liveContext.fillStyle = "rgba(45, 212, 191, .12)";
    liveContext.fillRect(gesture.startX, gesture.startY, x - gesture.startX, y - gesture.startY);
    liveContext.restore();
    drawBox([Math.min(gesture.startX, x) + 4, Math.min(gesture.startY, y) + 4, Math.max(gesture.startX, x) - 4, Math.max(gesture.startY, y) - 4], BACKGROUNDS[background].paint.selection);
  }
}

function finishMarquee({ startX, startY, endX, endY, adding }) {
  const left = Math.min(startX, endX);
  const right = Math.max(startX, endX);
  const top = Math.min(startY, endY);
  const bottom = Math.max(startY, endY);
  const inside = shapes.filter((shape) => {
    const bounds = boundsOf(shape);
    return !shape.locked && bounds[0] <= right && bounds[2] >= left && bounds[1] <= bottom && bounds[3] >= top;
  });
  setSelection(adding ? [...new Set([...selected, ...inside])] : inside);
}

function translated(shape, dx, dy) {
  return { ...shape, points: shape.points.map((value, index) => roundPoint(value + (index % 2 ? dy : dx))) };
}

function finishGesture(event) {
  const finished = gesture;
  gesture = null;
  liveCanvas.classList.remove("panning");
  if (finished.kind === "pen") {
    addShape(finished.shape);
    clearLive();
  } else if (finished.kind === "shape") {
    const { points } = finished.shape;
    clearLive();
    if (points[0] !== points[2] || points[1] !== points[3]) addShape(finished.shape);
  } else if (finished.kind === "pan") {
    scheduleSave();
  } else if (finished.kind === "move") {
    if (finished.moved) {
      const { x, y } = toWorld(event);
      replaceShapes(finished.moving, (shape) => translated(shape, x - finished.startX, y - finished.startY));
      renderBase();
    }
    renderLive();
  } else if (finished.kind === "resize") {
    if (finished.resized) replaceShapes([finished.shape], () => finished.resized);
    renderBase();
    renderLive();
  } else if (finished.kind === "marquee" && finished.convert) {
    finishConvertBox(finished);
  } else if (finished.kind === "marquee") {
    finishMarquee(finished);
  }
}

/* Two fingers on a touch screen pan and zoom the board */

function touchPair() {
  const [first, second] = touches.values();
  return { centreX: (first.x + second.x) / 2, centreY: (first.y + second.y) / 2, distance: Math.max(Math.hypot(first.x - second.x, first.y - second.y), 1) };
}

function startPinch() {
  // The first finger may have started a stroke, which the second finger cancels.
  finishZoom();
  closeTextEditor(true);
  gesture = { kind: "pinch", ...touchPair() };
  clearLive();
}

function continuePinch() {
  const pair = touchPair();
  const zoom = clampZoom(view.zoom * (pair.distance / gesture.distance));
  const box = liveCanvas.getBoundingClientRect();
  const worldX = (gesture.centreX - box.left - view.x) / view.zoom;
  const worldY = (gesture.centreY - box.top - view.y) / view.zoom;
  view = { zoom, x: pair.centreX - box.left - worldX * zoom, y: pair.centreY - box.top - worldY * zoom };
  Object.assign(gesture, pair);
  requestRender();
}

liveCanvas.addEventListener("pointerdown", (event) => {
  // A click outside the menu only closes it, so it can't leave a stray mark.
  if (isMenuOpen() || isOptionsOpen() || isColorPanelOpen()) {
    event.preventDefault();
    closeMenu();
    closeOptions();
    closeColorPanel();
    return;
  }
  if (event.pointerType === "pen") {
    penSeen = true;
    lastPenAt = performance.now();
    // A stroke whose lift was never reported shouldn't block the next letter.
    if (gesture && gesture.kind !== "pinch") finishGesture(event);
    if (gesture?.kind === "pinch") gesture = null;
  }
  if (event.pointerType === "touch") {
    touches.set(event.pointerId, { x: event.clientX, y: event.clientY });
    const writing = gesture?.kind === "pen" || performance.now() - lastPenAt < PALM_GUARD_MS;
    if (touches.size === 2 && !writing) {
      event.preventDefault();
      liveCanvas.setPointerCapture(event.pointerId);
      startPinch();
      return;
    }
    if (penSeen) {
      event.preventDefault();
      return;
    }
  }
  if (event.button !== 0 && event.button !== 1) return;
  event.preventDefault();
  if (textEditor) {
    closeTextEditor(true);
    return;
  }
  if (gesture) return;
  if (tool === "text" && event.button === 0 && !spaceHeld) {
    const point = toWorld(event);
    const hit = unlockedTextAt(point.x, point.y);
    if (hit) editTextShape(hit);
    else openTextEditor(point);
    return;
  }
  startGesture(event);
});
liveCanvas.addEventListener("pointermove", (event) => {
  if (touches.has(event.pointerId)) touches.set(event.pointerId, { x: event.clientX, y: event.clientY });
  if (gesture?.kind === "pinch") {
    if (touches.size === 2) continuePinch();
  } else if (gesture && event.pointerId === gesture.pointerId) {
    if (event.pointerType === "pen") lastPenAt = performance.now();
    continueGesture(event);
  }
});
liveCanvas.addEventListener("pointerup", (event) => {
  touches.delete(event.pointerId);
  if (event.pointerType === "pen") lastPenAt = performance.now();
  if (gesture?.kind === "pinch") {
    if (touches.size < 2) {
      gesture = null;
      scheduleSave();
    }
  } else if (gesture && event.pointerId === gesture.pointerId) {
    const stayedStill = (gesture.kind === "move" && !gesture.moved) || (gesture.kind === "resize" && !gesture.resized);
    const tapped = stayedStill && selected.length === 1 ? selected[0] : null;
    finishGesture(event);
    if (event.pointerType !== "mouse" && tapped) noteTap(tapped);
  }
});
liveCanvas.addEventListener("pointercancel", (event) => {
  touches.delete(event.pointerId);
  if (gesture?.kind === "pinch") {
    if (touches.size < 2) gesture = null;
    return;
  }
  if (!gesture || event.pointerId !== gesture.pointerId) return;
  // iPad Safari can interrupt a stroke mid-word, and what was already written should stay.
  if (gesture.kind === "pen") {
    finishGesture(event);
    return;
  }
  gesture = null;
  liveCanvas.classList.remove("panning");
  renderAll();
});
// iPad Safari otherwise claims quick pencil strokes for its own gestures, which interrupts them.
// Text mode is left alone, because the on-screen keyboard needs the tap to open.
for (const type of ["touchstart", "touchmove"]) {
  liveCanvas.addEventListener(type, (event) => {
    if (tool !== "text") event.preventDefault();
  }, { passive: false });
}

// Touch screens don't report a double-click on the board, so two quick taps on text open it for editing.
function noteTap(shape) {
  const now = performance.now();
  if (shape.type === "text" && lastTap.shape === shape && now - lastTap.time < DOUBLE_TAP_MS) {
    lastTap = { time: -Infinity, shape: null };
    if (!shape.locked) editTextShape(shape);
    return;
  }
  lastTap = { time: now, shape };
}

/* Text */

// Text is stored as lines of formatted pieces: { bullet, runs: [{ text, bold, italic }] }.
// Text saved before formatting existed has a plain "text" value instead.
function textLines(shape) {
  if (shape.lines) return shape.lines;
  return shape.text.split("\n").map((text) => ({ bullet: false, runs: [{ text, bold: false, italic: false }] }));
}

function textFont(fontSize, { bold, italic }, family = FONT) {
  return `${italic ? "italic " : ""}${bold ? "bold " : ""}${fontSize}px ${family}`;
}

function familyOf(shape) {
  return shape.hand ? HAND_FONT : FONT;
}

function drawTextShape(context, shape) {
  const { fontSize, points } = shape;
  context.textBaseline = "top";
  textLines(shape).forEach((line, index) => {
    const y = points[1] + index * fontSize * LINE_HEIGHT;
    let x = points[0];
    if (line.bullet) {
      context.font = textFont(fontSize, {}, familyOf(shape));
      context.fillText("•", x + fontSize * BULLET_MARK_OFFSET, y);
      x += fontSize * BULLET_INDENT;
    }
    for (const run of line.runs) {
      context.font = textFont(fontSize, run, familyOf(shape));
      context.fillText(run.text, x, y);
      x += context.measureText(run.text).width;
    }
  });
}

function measureLines(lines, fontSize, family = FONT) {
  let width = 0;
  for (const line of lines) {
    let lineWidth = line.bullet ? fontSize * BULLET_INDENT : 0;
    for (const run of line.runs) {
      liveContext.font = textFont(fontSize, run, family);
      lineWidth += liveContext.measureText(run.text).width;
    }
    width = Math.max(width, lineWidth);
  }
  return { width: Math.ceil(width), height: Math.ceil(lines.length * fontSize * LINE_HEIGHT) };
}

function appendEditorLine(parent, line) {
  for (const run of line.runs) {
    let node = document.createTextNode(run.text);
    if (run.italic) {
      const wrapper = document.createElement("i");
      wrapper.append(node);
      node = wrapper;
    }
    if (run.bold) {
      const wrapper = document.createElement("b");
      wrapper.append(node);
      node = wrapper;
    }
    parent.append(node);
  }
  if (!line.runs.some((run) => run.text)) parent.append(document.createElement("br"));
}

function fillEditor(input, lines) {
  let list = null;
  for (const line of lines) {
    if (line.bullet) {
      if (!list) {
        list = document.createElement("ul");
        input.append(list);
      }
      const item = document.createElement("li");
      appendEditorLine(item, line);
      list.append(item);
    } else {
      list = null;
      const row = document.createElement("div");
      appendEditorLine(row, line);
      input.append(row);
    }
  }
}

// Reads what the browser's editor produced back into plain lines and formatted pieces.
function readEditorLines(input) {
  const lines = [];
  let current = null;
  const startLine = (bullet) => { current = { bullet, runs: [] }; };
  const endLine = () => {
    if (current) lines.push(current);
    current = null;
  };
  const addText = (node) => {
    const text = node.nodeValue.replace(/ /g, " ").replace(/[\r\n]/g, "");
    if (!text) return;
    const style = getComputedStyle(node.parentElement);
    const bold = Number(style.fontWeight) >= 600;
    const italic = style.fontStyle === "italic";
    if (!current) startLine(false);
    const last = current.runs[current.runs.length - 1];
    if (last && last.bold === bold && last.italic === italic) last.text += text;
    else current.runs.push({ text, bold, italic });
  };
  const walk = (parent, bullet) => {
    for (const node of parent.childNodes) {
      if (node.nodeType === Node.TEXT_NODE) {
        addText(node);
      } else if (node.nodeName === "BR") {
        // A final line break only keeps an empty line open in the browser, unless the line really is empty.
        if (!current) startLine(bullet);
        if (node.nextSibling || !current.runs.length) endLine();
      } else if (["DIV", "P", "LI", "UL", "OL"].includes(node.nodeName)) {
        // A block that only wraps other blocks, such as a list inside a div, isn't a blank line.
        if (current?.runs.length) endLine();
        const inBullet = bullet || node.nodeName === "LI";
        startLine(inBullet);
        walk(node, inBullet);
        if (current?.runs.length) endLine();
        current = null;
      } else {
        walk(node, bullet);
      }
    }
  };
  walk(input, false);
  endLine();
  while (lines.length && !lines[lines.length - 1].runs.some((run) => run.text.trim())) lines.pop();
  return lines;
}

function updateFormatButtons() {
  if (!textEditor) return;
  for (const [id, command] of [["format-bold", "bold"], ["format-italic", "italic"], ["format-bullets", "insertUnorderedList"]]) {
    element(id).setAttribute("aria-pressed", String(document.queryCommandState(command)));
  }
}

function applyFormat(command) {
  if (!textEditor) return;
  textEditor.input.focus();
  document.execCommand(command);
  placeFormatBar();
  updateFormatButtons();
}

function placeFormatBar() {
  const { input } = textEditor;
  const bar = element("text-format");
  bar.hidden = false;
  const stage = element("stage").getBoundingClientRect();
  const box = input.getBoundingClientRect();
  const left = Math.max(8, Math.min(box.left - stage.left, stage.width - bar.offsetWidth - 8));
  const above = box.top - stage.top - bar.offsetHeight - 8;
  const top = above >= 60 ? above : box.bottom - stage.top + 8;
  bar.style.left = `${left}px`;
  bar.style.top = `${Math.min(top, stage.height - bar.offsetHeight - 8)}px`;
}

function changeTextSize(direction) {
  if (!textEditor) return;
  const next = direction > 0 ? textEditor.fontSize * TEXT_SIZE_STEP : textEditor.fontSize / TEXT_SIZE_STEP;
  textEditor.fontSize = Math.round(Math.min(MAX_TEXT_SIZE, Math.max(MIN_TEXT_SIZE, next)));
  if (!textEditor.existing) chosenTextSize = textEditor.fontSize;
  textEditor.input.style.fontSize = `${textEditor.fontSize * view.zoom}px`;
  element("format-size").textContent = textEditor.fontSize;
  textEditor.input.focus();
  placeFormatBar();
}

function selectEditorContents(input) {
  const range = document.createRange();
  range.selectNodeContents(input);
  const selection = getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
}

function openTextEditor(point, existing = null) {
  const input = document.createElement("div");
  const fontSize = existing ? existing.fontSize : chosenTextSize || SIZES[sizeIndex][2];
  const textColor = existing ? existing.color : color;
  input.id = "text-input";
  input.contentEditable = "true";
  input.spellcheck = false;
  input.setAttribute("role", "textbox");
  input.setAttribute("aria-multiline", "true");
  input.setAttribute("aria-label", "Text for the board");
  input.style.left = `${point.x * view.zoom + view.x}px`;
  input.style.top = `${point.y * view.zoom + view.y}px`;
  input.style.color = paintFor(textColor);
  input.style.fontSize = `${fontSize * view.zoom}px`;
  if (existing) input.style.fontFamily = familyOf(existing);
  input.addEventListener("input", () => placeFormatBar());
  input.addEventListener("keydown", (event) => {
    const command = event.ctrlKey || event.metaKey;
    // Ctrl+. still has to reach the page, while other keys belong to the text.
    if (command && !event.shiftKey && event.key === ".") return;
    event.stopPropagation();
    if (event.key === "Escape" || (command && event.key === "Enter")) {
      event.preventDefault();
      closeTextEditor(true);
    } else if (event.key === "Tab") {
      event.preventDefault();
      document.execCommand("insertText", false, "    ");
    } else if (command && event.shiftKey && event.code === "Digit8") {
      event.preventDefault();
      applyFormat("insertUnorderedList");
    } else if (command && event.shiftKey && (event.code === "Period" || event.code === "Comma")) {
      event.preventDefault();
      changeTextSize(event.code === "Period" ? 1 : -1);
    }
  });
  input.addEventListener("paste", (event) => {
    event.preventDefault();
    // An image can't go inside text, so it joins the board as usual.
    const pastedImage = imageFromClipboard(event.clipboardData);
    if (pastedImage && !event.clipboardData.getData("text/plain")) {
      closeTextEditor(true);
      addImageFile(pastedImage);
      return;
    }
    document.execCommand("insertText", false, event.clipboardData.getData("text/plain"));
  });
  input.addEventListener("blur", () => {
    // Switching to another window, such as for screen sharing, shouldn't end the editing.
    if (document.hasFocus()) closeTextEditor(true);
  });
  if (existing) fillEditor(input, textLines(existing));
  textEditor = { input, point, fontSize, color: textColor, existing };
  element("format-size").textContent = fontSize;
  element("stage").append(input);
  if (existing) {
    renderBase(new Set([existing]));
    clearLive();
  }
  input.focus();
  document.execCommand("defaultParagraphSeparator", false, "div");
  if (existing) selectEditorContents(input);
  placeFormatBar();
  updateFormatButtons();
}

function finishEditedText(existing, lines, fontSize) {
  const size = measureLines(lines, fontSize, familyOf(existing));
  if (!lines.length) {
    selected = selected.filter((shape) => shape !== existing);
    commit(shapes.filter((shape) => shape !== existing));
  } else if (fontSize !== existing.fontSize || JSON.stringify(lines) !== JSON.stringify(textLines(existing))) {
    replaceShapes([existing], ({ text, ...shape }) => ({ ...shape, lines, fontSize, ...size }));
  }
  renderAll();
}

function closeTextEditor(keep) {
  if (!textEditor) return;
  const { input, point, fontSize, color: textColor, existing } = textEditor;
  textEditor = null;
  const lines = readEditorLines(input);
  input.remove();
  element("text-format").hidden = true;
  if (existing) {
    if (keep) finishEditedText(existing, lines, fontSize);
    else renderAll();
    return;
  }
  if (!keep || !lines.length) return;
  addShape({
    type: "text",
    color: textColor,
    size: 1,
    fontSize,
    lines,
    points: [roundPoint(point.x), roundPoint(point.y)],
    ...measureLines(lines, fontSize),
  });
}

function unlockedTextAt(x, y) {
  const hit = unlockedShapeAt(x, y);
  return hit && hit.type === "text" ? hit : null;
}

function editTextShape(shape) {
  setTool("select");
  setSelection([shape]);
  openTextEditor({ x: shape.points[0], y: shape.points[1] }, shape);
}

liveCanvas.addEventListener("dblclick", (event) => {
  if (tool !== "select" || textEditor) return;
  const { x, y } = toWorld(event);
  const hit = unlockedTextAt(x, y);
  if (hit) editTextShape(hit);
});

for (const [id, command] of [["format-bold", "bold"], ["format-italic", "italic"], ["format-bullets", "insertUnorderedList"]]) {
  // Stopping the mouse press keeps the text selected, so the format applies to it.
  element(id).addEventListener("mousedown", (event) => event.preventDefault());
  element(id).addEventListener("click", () => applyFormat(command));
}
element("text-format").addEventListener("mousedown", (event) => event.preventDefault());
element("format-smaller").addEventListener("click", () => changeTextSize(-1));
element("format-bigger").addEventListener("click", () => changeTextSize(1));
document.addEventListener("selectionchange", updateFormatButtons);

/* Images */

function imageFromClipboard(data) {
  for (const item of data?.items || []) {
    if (item.kind === "file" && item.type.startsWith("image/")) return item.getAsFile();
  }
  return null;
}

function decodeImageFile(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const image = new Image();
    image.onload = () => {
      URL.revokeObjectURL(url);
      resolve(image);
    };
    image.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("unreadable"));
    };
    image.src = url;
  });
}

// Shrinks an image to fit the sheet. Small images stay sharp PNGs, and larger ones become JPEGs on white.
function compressImage(image) {
  let side = Math.min(MAX_IMAGE_SIDE, Math.max(image.naturalWidth, image.naturalHeight));
  for (;;) {
    const scale = side / Math.max(image.naturalWidth, image.naturalHeight);
    const canvas = Object.assign(document.createElement("canvas"), {
      width: Math.max(1, Math.round(image.naturalWidth * scale)),
      height: Math.max(1, Math.round(image.naturalHeight * scale)),
    });
    const context = canvas.getContext("2d");
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    const png = canvas.toDataURL("image/png");
    if (png.length <= MAX_KEPT_PNG_LENGTH) return { src: png, width: canvas.width, height: canvas.height };
    context.globalCompositeOperation = "destination-over";
    context.fillStyle = "#fff";
    context.fillRect(0, 0, canvas.width, canvas.height);
    const jpeg = canvas.toDataURL("image/jpeg", IMAGE_QUALITY);
    if (jpeg.length <= MAX_IMAGE_LENGTH) return { src: jpeg, width: canvas.width, height: canvas.height };
    side *= IMAGE_SHRINK;
  }
}

function imagesLength() {
  return shapes.reduce((total, shape) => total + (shape.src ? shape.src.length : 0), 0);
}

async function addImageFile(file) {
  if (!currentBoard || !file) return;
  if (!file.type.startsWith("image/") || file.size > MAX_IMAGE_FILE_BYTES) {
    return showNotice("That file can't be added. Use an image smaller than 25 MB.");
  }
  let compressed;
  try {
    compressed = compressImage(await decodeImageFile(file));
  } catch (error) {
    return showNotice("That image couldn't be read. Try a JPEG or PNG.");
  }
  if (imagesLength() + compressed.src.length > MAX_CANVAS_IMAGES_LENGTH) {
    return showNotice("This canvas has too many images to save online. Delete one, or start a new canvas.");
  }
  hideNotice();
  const shrink = Math.min(1, (liveCanvas.clientWidth * NEW_IMAGE_SCREEN_SHARE) / view.zoom / compressed.width, (liveCanvas.clientHeight * NEW_IMAGE_SCREEN_SHARE) / view.zoom / compressed.height);
  const width = compressed.width * shrink;
  const height = compressed.height * shrink;
  const left = (liveCanvas.clientWidth / 2 - view.x) / view.zoom - width / 2;
  const top = (liveCanvas.clientHeight / 2 - view.y) / view.zoom - height / 2;
  const shape = {
    type: "image",
    color: "ink",
    size: 0,
    src: compressed.src,
    points: [roundPoint(left), roundPoint(top), roundPoint(left + width), roundPoint(top + height)],
  };
  commit([...shapes, shape]);
  // Starts in Select, with the corners showing, so the image is ready to move or resize.
  setTool("select");
  setSelection([shape]);
  renderBase();
}

element("color-custom").addEventListener("input", (event) => {
  color = event.target.value;
  updateControls();
});
element("color-custom").addEventListener("change", () => closeColorPanel());

element("image-file").addEventListener("change", (event) => {
  addImageFile(event.target.files[0]);
  event.target.value = "";
});
document.addEventListener("paste", (event) => {
  if (!currentBoard || event.target.matches?.("input, textarea, [contenteditable]")) return;
  const file = imageFromClipboard(event.clipboardData);
  if (!file) return;
  event.preventDefault();
  addImageFile(file);
});
element("stage").addEventListener("dragover", (event) => event.preventDefault());
element("stage").addEventListener("drop", (event) => {
  event.preventDefault();
  addImageFile(event.dataTransfer.files[0]);
});

/* Handwriting to text */

let handOn = false;
let handNoteTimer = null;
let toolBeforeConvert = "pen";
// Answers from before the switch was turned off, or from another canvas, are ignored.
let handGeneration = 0;
let nextHandJob = 0;
const handJobs = new Map();
// Writing being read is dimmed straight away, so a conversion responds the moment it's asked for.
const readingStrokes = new Set();

function setHandStatus(text, temporary = false) {
  clearTimeout(handNoteTimer);
  element("hand-status").textContent = text;
  if (temporary) handNoteTimer = setTimeout(() => { element("hand-status").textContent = ""; }, HAND_NOTE_MS);
}

function loadHandFont() {
  return Promise.all([document.fonts.load(`20px Caveat`), document.fonts.load(`bold 20px Caveat`)])
    .then(() => { if (currentBoard) renderAll(); })
    .catch(() => {});
}

function rememberHandChoice() {
  try {
    localStorage.setItem(HAND_KEY, handOn ? "on" : "off");
  } catch (error) {
    // The switch still works for this visit.
  }
}

function setHandSwitch(on) {
  handOn = on;
  handGeneration++;
  handJobs.clear();
  if (readingStrokes.size) {
    readingStrokes.clear();
    if (currentBoard) renderBase();
  }
  element("hand-toggle").setAttribute("aria-checked", String(on));
  element("hand-toggle-label").textContent = `Handwriting to text: ${on ? "On" : "Off"}`;
  rememberHandChoice();
  controlButtons.tools.convert.hidden = !on;
  if (!on) {
    setHandStatus("");
    if (tool === "convert") setTool(toolBeforeConvert);
  }
  updateControls();
}

function isConvertibleStroke(shape) {
  return shape.type === "pen" && !shape.locked;
}

// Writing counts as chosen when its middle is inside the box, so an arrow that only crosses the edge stays out.
function strokesInBox({ startX, startY, endX, endY }) {
  const left = Math.min(startX, endX);
  const right = Math.max(startX, endX);
  const top = Math.min(startY, endY);
  const bottom = Math.max(startY, endY);
  return shapes.filter((shape) => {
    if (!isConvertibleStroke(shape)) return false;
    const bounds = boundsOf(shape);
    const middleX = (bounds[0] + bounds[2]) / 2;
    const middleY = (bounds[1] + bounds[3]) / 2;
    return middleX >= left && middleX <= right && middleY >= top && middleY <= bottom;
  });
}

function finishConvertBox(box) {
  const strokes = strokesInBox(box);
  setTool(toolBeforeConvert);
  if (!strokes.length) return setHandStatus("No pen writing in that box. Drag it around your words.", true);
  convertStrokes(strokes);
}

function convertSelection() {
  const strokes = selected.filter(isConvertibleStroke);
  if (!strokes.length) return;
  setSelection([]);
  convertStrokes(strokes);
}

function lineFrom(strokes) {
  const [left, top, right, bottom] = unionBounds(strokes);
  return { strokes, left, top, right, bottom };
}

// Finds rows first, tallest strokes leading, so that dots and commas join the letters they belong to.
function groupIntoRows(strokes) {
  const rows = [];
  const byHeight = [...strokes].sort((first, second) => {
    const [, firstTop, , firstBottom] = boundsOf(first);
    const [, secondTop, , secondBottom] = boundsOf(second);
    return (secondBottom - secondTop) - (firstBottom - firstTop);
  });
  for (const stroke of byHeight) {
    const [, top, , bottom] = boundsOf(stroke);
    const middle = (top + bottom) / 2;
    const row = rows.find((item) => {
      const reach = (item.bottom - item.top) * 0.3;
      return middle >= item.top - reach && middle <= item.bottom + reach;
    });
    if (row) {
      row.strokes.push(stroke);
      row.top = Math.min(row.top, top);
      row.bottom = Math.max(row.bottom, bottom);
    } else {
      rows.push({ strokes: [stroke], top, bottom });
    }
  }
  return rows;
}

// Writing far apart on the same row stays as separate pieces of text, where it was written.
function groupIntoLines(strokes) {
  const lines = [];
  for (const row of groupIntoRows(strokes)) {
    const maxGap = (row.bottom - row.top) * HAND_WORD_GAP;
    const leftToRight = [...row.strokes].sort((first, second) => boundsOf(first)[0] - boundsOf(second)[0]);
    let piece = [];
    let reachedRight = -Infinity;
    for (const stroke of leftToRight) {
      const [left, , right] = boundsOf(stroke);
      if (piece.length && left - reachedRight > maxGap) {
        lines.push(lineFrom(piece));
        piece = [];
        reachedRight = -Infinity;
      }
      piece.push(stroke);
      reachedRight = Math.max(reachedRight, right);
    }
    lines.push(lineFrom(piece));
  }
  return lines;
}

// The reader expects dark writing on white, whatever colour or background the board uses.
function handwritingImage({ strokes, left, right, top, bottom }) {
  const padding = HAND_IMAGE_HEIGHT / 4;
  const scale = Math.min(HAND_IMAGE_HEIGHT / Math.max(bottom - top, 1), (HAND_MAX_IMAGE_WIDTH - padding * 2) / Math.max(right - left, 1));
  const canvas = Object.assign(document.createElement("canvas"), {
    width: Math.ceil((right - left) * scale + padding * 2),
    height: Math.ceil((bottom - top) * scale + padding * 2),
  });
  const context = canvas.getContext("2d");
  context.fillStyle = "#fff";
  context.fillRect(0, 0, canvas.width, canvas.height);
  context.setTransform(scale, 0, 0, scale, padding - left * scale, padding - top * scale);
  context.strokeStyle = "#000";
  context.fillStyle = "#000";
  context.lineWidth = HAND_INK_WIDTH / scale;
  context.lineCap = "round";
  context.lineJoin = "round";
  for (const { points } of strokes) {
    context.beginPath();
    if (points.length === 2) {
      context.arc(points[0], points[1], context.lineWidth / 2, 0, Math.PI * 2);
      context.fill();
    } else {
      tracePen(context, points);
      context.stroke();
    }
  }
  return canvas.toDataURL("image/png");
}

function convertStrokes(strokes) {
  strokes.forEach((stroke) => readingStrokes.add(stroke));
  renderBase();
  setHandStatus("Reading your writing...");
  for (const line of groupIntoLines(strokes)) {
    const id = nextHandJob++;
    handJobs.set(id, { line, boardId: currentBoard.id, generation: handGeneration, startedAt: performance.now() });
    readHandwriting(id, line);
  }
}

function secondsSince(startedAt) {
  return ((performance.now() - startedAt) / 1000).toFixed(1);
}

function handProblemMessage(error) {
  if (error === "nokey") return "Add your Gemini key first: Student admin > Set Gemini API key in the Google Sheet.";
  if (error === "limit") return "Today's conversion limit is reached, so your writing was left as it is.";
  if (error === "quota") return "Your Gemini key is over its usage limit, so your writing was left as it is. Check your plan and limits in Google AI Studio.";
  if (error === "busy") return "Gemini is busy right now, so your writing was left as it is. Try again shortly.";
  return "Couldn't convert that writing, so it was left as it is.";
}

let workerAccess = null;
let workerAccessRequest = null;

// Asks the backend for the Worker's address and a pass, once, ready for the first conversion.
function loadWorkerAccess() {
  if (workerAccess && (!workerAccess.url || workerAccess.expiry - Date.now() > WORKER_PASS_MARGIN_MS)) return Promise.resolve(workerAccess);
  if (!workerAccessRequest) {
    workerAccessRequest = callBackend({ action: "adminWorkerPass", token: getAdminToken() })
      .then((result) => {
        workerAccess = result.ok ? result : null;
        return workerAccess;
      })
      .catch(() => null)
      .finally(() => { workerAccessRequest = null; });
  }
  return workerAccessRequest;
}

// Returns null when the Worker can't answer, so that the slower route can be used instead.
async function askWorker(image) {
  const access = await loadWorkerAccess();
  if (!access?.url) return null;
  try {
    // Plain text avoids an extra permission request from the browser before each conversion.
    const response = await fetch(access.url, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ pass: access.pass, image }) });
    if (!response.ok) return null;
    const result = await response.json();
    if (result.error === "session") {
      workerAccess = null;
      return null;
    }
    return result;
  } catch (error) {
    return null;
  }
}

async function readHandwriting(id, line) {
  const image = handwritingImage(line);
  try {
    const result = await askWorker(image) || await callBackend({ action: "adminHandwriting", token: getAdminToken(), image });
    if (result.error === "session") {
      handleEndedSession(true);
      finishHandJob(id, "", "session");
    } else {
      finishHandJob(id, result.ok ? result.text : "", result.error, result.geminiMs);
    }
  } catch (error) {
    finishHandJob(id, "", "network");
  }
}

function finishHandJob(id, text, problem, geminiMs) {
  const job = handJobs.get(id);
  handJobs.delete(id);
  if (!handJobs.size) setHandStatus("");
  if (job) {
    job.line.strokes.forEach((stroke) => readingStrokes.delete(stroke));
    if (currentBoard) renderBase(gesture?.kind === "move" ? new Set(gesture.moving) : null);
  }
  if (!job || job.generation !== handGeneration || !currentBoard || job.boardId !== currentBoard.id) return;
  const { line } = job;
  if (problem === "session") return;
  if (problem) return setHandStatus(handProblemMessage(problem), true);
  const rows = text.split("\n").map((row) => row.trim()).filter(Boolean);
  if (!rows.length) return setHandStatus("Couldn't read that writing, so it was left as it is.", true);
  // The writing may have been erased, moved or undone while it was being read.
  if (!line.strokes.every((stroke) => shapes.includes(stroke))) return;
  const fontSize = Math.round(Math.min(HAND_MAX_FONT, Math.max(HAND_MIN_FONT, ((line.bottom - line.top) * HAND_FONT_SCALE) / rows.length)));
  const lines = rows.map((row) => ({ bullet: false, runs: [{ text: row, bold: false, italic: false }] }));
  const converted = {
    type: "text",
    hand: true,
    color: line.strokes[0].color,
    size: 1,
    fontSize,
    lines,
    points: [roundPoint(line.left), roundPoint((line.top + line.bottom) / 2 - (rows.length * fontSize * LINE_HEIGHT) / 2)],
    ...measureLines(lines, fontSize, HAND_FONT),
  };
  const removed = new Set(line.strokes);
  selected = selected.filter((shape) => !removed.has(shape));
  commit([...shapes.filter((shape) => !removed.has(shape)), converted]);
  if (gesture) renderBase(gesture.kind === "move" ? new Set(gesture.moving) : null);
  else renderAll();
  const timing = geminiMs ? `in ${secondsSince(job.startedAt)} s (Gemini ${(geminiMs / 1000).toFixed(1)} s)` : `in ${secondsSince(job.startedAt)} s`;
  setHandStatus(`Converted ${timing}. Ctrl+Z brings your writing back.`, true);
}

/* Zoom */

function clampZoom(zoom) {
  return Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom));
}

function takeZoomPicture() {
  if (shapes.length <= PICTURE_ZOOM_SHAPES) return null;
  const canvas = Object.assign(document.createElement("canvas"), { width: baseCanvas.width, height: baseCanvas.height });
  canvas.getContext("2d").drawImage(baseCanvas, 0, 0);
  return { canvas, view: { ...view } };
}

function drawZoomPicture({ canvas, view: from }) {
  const scale = view.zoom / from.zoom;
  fillBackground();
  baseContext.drawImage(canvas, (view.x - from.x * scale) * pixelRatio, (view.y - from.y * scale) * pixelRatio, canvas.width * scale, canvas.height * scale);
}

function zoomFrame(now) {
  const animation = zoomAnimation;
  if (!animation) return;
  // The first frame's clock can read slightly earlier than the moment the zoom started.
  const elapsed = Math.max(0, now - animation.lastFrame);
  animation.lastFrame = now;
  const ease = 1 - Math.exp(-elapsed / ZOOM_EASE_MS);
  // Moving through the logarithm makes zooming in and zooming out feel equally fast.
  const logZoom = Math.log(view.zoom);
  const nextZoom = Math.exp(logZoom + (Math.log(animation.zoom) - logZoom) * ease);
  let settled = Math.abs(Math.log(animation.zoom) - Math.log(nextZoom)) < ZOOM_STOP_DISTANCE;
  if (animation.anchor) {
    const { x, y } = animation.anchor;
    const zoom = settled ? animation.zoom : nextZoom;
    view.x = x - ((x - view.x) / view.zoom) * zoom;
    view.y = y - ((y - view.y) / view.zoom) * zoom;
    view.zoom = zoom;
  } else {
    view.x += (animation.x - view.x) * ease;
    view.y += (animation.y - view.y) * ease;
    settled = settled && Math.hypot(animation.x - view.x, animation.y - view.y) < 0.5;
    view.zoom = settled ? animation.zoom : nextZoom;
    if (settled) {
      view.x = animation.x;
      view.y = animation.y;
    }
  }
  if (settled) {
    zoomAnimation = null;
    renderAll();
    scheduleSave();
    return;
  }
  if (animation.picture) {
    drawZoomPicture(animation.picture);
    clearLive();
    showZoomLevel();
  } else {
    renderAll();
  }
  animation.frame = requestAnimationFrame(zoomFrame);
}

function startZoomAnimation(target) {
  closeTextEditor(true);
  if (zoomAnimation) {
    cancelAnimationFrame(zoomAnimation.frame);
    target.picture = zoomAnimation.picture;
  } else {
    target.picture = takeZoomPicture();
  }
  target.lastFrame = performance.now();
  zoomAnimation = target;
  target.frame = requestAnimationFrame(zoomFrame);
}

function zoomAround(screenX, screenY, factor) {
  // Repeated wheel steps add to where the zoom is heading, not to where it has reached so far.
  const heading = zoomAnimation ? zoomAnimation.zoom : view.zoom;
  startZoomAnimation({ zoom: clampZoom(heading * factor), anchor: { x: screenX, y: screenY } });
}

function zoomAtCentre(factor) {
  zoomAround(liveCanvas.clientWidth / 2, liveCanvas.clientHeight / 2, factor);
}

function resetView() {
  startZoomAnimation({ zoom: 1, x: 0, y: 0, anchor: null });
}

// Jumps to where the zoom is heading, so that a new stroke lands exactly where it's drawn.
function finishZoom() {
  if (!zoomAnimation) return;
  const animation = zoomAnimation;
  cancelAnimationFrame(animation.frame);
  zoomAnimation = null;
  if (animation.anchor) {
    const { x, y } = animation.anchor;
    view.x = x - ((x - view.x) / view.zoom) * animation.zoom;
    view.y = y - ((y - view.y) / view.zoom) * animation.zoom;
    view.zoom = animation.zoom;
  } else {
    view = { x: animation.x, y: animation.y, zoom: animation.zoom };
  }
  renderAll();
  scheduleSave();
}

liveCanvas.addEventListener("wheel", (event) => {
  event.preventDefault();
  if (event.ctrlKey || event.metaKey) {
    const box = liveCanvas.getBoundingClientRect();
    const step = Math.max(-MAX_WHEEL_STEP, Math.min(MAX_WHEEL_STEP, event.deltaY));
    zoomAround(event.clientX - box.left, event.clientY - box.top, Math.exp(-step * WHEEL_ZOOM_SPEED));
  } else {
    finishZoom();
    view.x -= event.deltaX;
    view.y -= event.deltaY;
    requestRender();
    scheduleSave();
  }
}, { passive: false });
element("zoom-in").addEventListener("click", () => zoomAtCentre(BUTTON_ZOOM_STEP));
element("zoom-out").addEventListener("click", () => zoomAtCentre(1 / BUTTON_ZOOM_STEP));
element("zoom-reset").addEventListener("click", resetView);

function separator() {

const controlButtons = { tools: {}, colors: {}, sizes: [], backgrounds: {}, palette: {} };

function buildToolbar() {
  const bar = element("tools");
  for (const { id, label, key, icon } of TOOLS) {
    controlButtons.tools[id] = makeToolButton(`${label} (${key.toUpperCase()})`, `<svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg>`, () => setTool(id));

  bar.append(controlButtons.image, separator());
  for (const [name, value] of COLORS) {
    controlButtons.colors[value] = makeToolButton(name, '<span class="swatch"></span>', () => {
      color = value;

    });
    bar.append(controlButtons.colors[value]);
  }
  controlButtons.moreColors = makeToolButton("More colours", '<span class="swatch swatch-rainbow"></span>', toggleColorPanel);
  controlButtons.moreColors.setAttribute("aria-expanded", "false");
  controlButtons.moreColors.setAttribute("aria-controls", "color-panel");

  for (const [name, value] of MORE_COLORS) {
