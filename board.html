  controlButtons.undo = makeToolButton("Undo (Ctrl+Z)", '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 5 5"/></svg>', undo);
  controlButtons.redo = makeToolButton("Redo (Ctrl+Shift+Z)", '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 0 0-5 5"/></svg>', redo);
  controlButtons.clear = makeToolButton("Clear everything that isn't locked", '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>', clearBoard);
  controlButtons.lock = makeToolButton("Lock selected (Ctrl+Shift+L)", '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>', lockSelected);
  controlButtons.unlock = makeToolButton("Unlock", '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>', unlockShapes);
  bar.append(controlButtons.undo, controlButtons.redo, controlButtons.clear, separator(), controlButtons.lock, controlButtons.unlock);

  for (const [id, { label }] of Object.entries(BACKGROUNDS)) {
    controlButtons.backgrounds[id] = Object.assign(document.createElement("button"), { type: "button", textContent: label });
    controlButtons.backgrounds[id].addEventListener("click", () => setBackground(id));
    element("backgrounds").append(controlButtons.backgrounds[id]);
  }
}

function setBackground(id) {
  background = id;
  element("stage").style.background = BACKGROUNDS[id].fill;
  scheduleSave();
  updateControls();
  renderAll();
}

function updateControls() {
  for (const [id, button] of Object.entries(controlButtons.tools)) button.setAttribute("aria-pressed", String(id === tool));
  for (const [value, button] of Object.entries(controlButtons.colors)) {
    button.setAttribute("aria-pressed", String(value === color));
    button.firstChild.style.setProperty("--swatch", paintFor(value));
  }
  for (const [value, swatch] of Object.entries(controlButtons.palette)) {
    swatch.style.background = paintFor(value);
    swatch.setAttribute("aria-pressed", String(value === color));
  }
  controlButtons.moreColors.setAttribute("aria-pressed", String(!COLORS.some(([, value]) => value === color)));
  for (const [id, button] of Object.entries(controlButtons.backgrounds)) button.setAttribute("aria-pressed", String(id === background));
  controlButtons.sizes.forEach((button, index) => button.setAttribute("aria-pressed", String(index === sizeIndex)));
  controlButtons.undo.disabled = !undoStack.length;
  controlButtons.redo.disabled = !redoStack.length;
  controlButtons.clear.disabled = shapes.every((shape) => shape.locked);
  controlButtons.lock.disabled = !selected.some((shape) => !shape.locked);
  element("convert-selected").hidden = !handOn || !selected.some(isConvertibleStroke);
  const lockedCount = shapes.filter((shape) => shape.locked).length;
  const selectedLocked = selected.filter((shape) => shape.locked).length;
  controlButtons.unlock.disabled = !lockedCount;
  const unlockLabel = selectedLocked ? `Unlock selected (${selectedLocked})` : `Unlock all (${lockedCount} locked)`;
  controlButtons.unlock.title = unlockLabel;
  controlButtons.unlock.setAttribute("aria-label", unlockLabel);
}

document.addEventListener("keydown", (event) => {
  if (!currentBoard) return;
  const key = event.key.toLowerCase();
  const command = event.ctrlKey || event.metaKey;
  if (command && key === ".") {
    event.preventDefault();
    toggleTools();
    return;
  }
  if (key === "escape" && isMenuOpen()) {
    closeMenu(true);
    return;
  }
  if (key === "escape" && isOptionsOpen()) {
    closeOptions(true);
    return;
  }
  if (key === "escape" && isColorPanelOpen()) {
    closeColorPanel(true);
    return;
  }
  if (event.target.matches?.("input, textarea, [contenteditable]")) return;
  // The board list keeps its own keys, apart from Ctrl+A, which would otherwise select the whole page.
  if (event.target.matches?.("select") && !(command && key === "a")) return;
  if (command && event.shiftKey && key === "l") {
    event.preventDefault();
    if (selected.some((shape) => !shape.locked)) lockSelected();
    else unlockShapes();
  } else if (command && key === "a") {
    event.preventDefault();
    selectAll();
  } else if (command && key === "z") {
    event.preventDefault();
    if (event.shiftKey) redo();
    else undo();
  } else if (command && key === "y") {
    event.preventDefault();
    redo();
  } else if (command) {
    return;
  } else if (key === " ") {
    event.preventDefault();
    spaceHeld = true;
    liveCanvas.classList.add("panning");
  } else if (key === "delete" || key === "backspace") {
    deleteSelected();
  } else if (key === "enter") {
    if (handOn) convertSelection();
  } else if (key === "escape") {
    setSelection([]);
  } else if (key === "=" || key === "+") {
    zoomAtCentre(BUTTON_ZOOM_STEP);
  } else if (key === "-") {
    zoomAtCentre(1 / BUTTON_ZOOM_STEP);
  } else if (key === "0") {
    resetView();
  } else {
    const match = TOOLS.find((item) => item.key === key);
    if (match && (match.id !== "convert" || handOn)) setTool(match.id);
  }
});
document.addEventListener("keyup", (event) => {
  if (event.key !== " ") return;
  spaceHeld = false;
  if (!gesture) liveCanvas.classList.remove("panning");
});

/* Saving: every change goes to this computer at once, then to the Google Sheet in the background */

function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 2);
    request.onupgradeneeded = () => {
      if (request.result.objectStoreNames.contains(STORE)) request.result.deleteObjectStore(STORE);
      request.result.createObjectStore(STORE, { keyPath: "id" });
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function runStore(mode, work) {
  return new Promise((resolve, reject) => {
    const transaction = database.transaction(STORE, mode);
    const request = work(transaction.objectStore(STORE));
    transaction.oncomplete = () => resolve(request.result);
    transaction.onerror = () => reject(transaction.error);
    transaction.onabort = () => reject(transaction.error);
  });
}

function showNotice(message, actions = []) {
  const notice = element("board-notice");
  notice.textContent = message;
  for (const { label, action } of actions) {
    const button = Object.assign(document.createElement("button"), { type: "button", className: "notice-button", textContent: label });
    button.addEventListener("click", action);
    notice.append(button);
  }
  notice.hidden = false;
  if (currentBoard) resizeCanvases();
}

function hideNotice() {
  element("board-notice").hidden = true;
}

async function readLocal(id) {
  if (!database) return memoryBoards.get(id) || null;
  return (await runStore("readonly", (store) => store.get(id))) || null;
}

async function writeLocal(record) {
  memoryBoards.set(record.id, record);
  if (!database) return;
  try {
    await runStore("readwrite", (store) => store.put(record));
  } catch (error) {
    showNotice("This computer's browser storage is full, so the newest changes may not be kept here. They'll still try to save online.");
  }
}

async function removeLocal(id) {
  memoryBoards.delete(id);
  if (database) await runStore("readwrite", (store) => store.delete(id));
}

async function allLocal() {
  if (!database) return [...memoryBoards.values()];
  return runStore("readonly", (store) => store.getAll());
}

function scheduleSave() {
  if (!currentBoard) return;
  savePending = true;
  setSaveStatus("Saving...");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, SAVE_DELAY_MS);
}

async function flushSave() {
  clearTimeout(saveTimer);
  if (!savePending || !currentBoard) return;
  savePending = false;
  currentBoard = {
    ...currentBoard,
    shapes,
    background,
    view: { ...view },
    dirty: true,
    conflict: false,
    revision: currentBoard.revision + 1,
  };
  await writeLocal(currentBoard);
  syncSoon(SYNC_DELAY_MS);
}

function syncSoon(delay) {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncAll, delay);
}

function setSaveStatus(text) {
  element("save-status").textContent = text;
}

function refreshSaveStatus() {
  if (!currentBoard) return;
  if (currentBoard.conflict) return setSaveStatus("Not saved online. Choose a version above.");
  if (savePending || (currentBoard.dirty && syncRunning)) return setSaveStatus("Saving...");
  if (sessionEnded && currentBoard.dirty) return setSaveStatus("Saved on this computer. Log in again to save online.");
  if (currentBoard.dirty) return setSaveStatus("Saved on this computer. Will save online when it can.");
  setSaveStatus("Saved");
}

function boardData(record) {
  return JSON.stringify({ shapes: record.shapes, view: record.view, background: record.background });
}

// Sends one canvas to the sheet. Returns false when the connection or session means it's time to stop.
async function uploadRecord(record, force) {
  let result;
  try {
    result = await callBackend({
      action: "adminBoardSave",
      token: getAdminToken(),
      id: record.id,
      data: boardData(record),
      baseUpdatedAt: force ? "" : record.baseUpdatedAt,
    });
  } catch (error) {
    return false;
  }
  if (result.error === "session") {
    sessionEnded = true;
    showNotice("Your admin session has ended. Your work is safe on this computer.", [{ label: "Log in again", action: () => location.assign("admin.html") }]);
    return false;
  }
  if (result.error === "conflict") {
    await markConflict(record);
    return true;
  }
  if (result.error === "toolarge") {
    if (currentBoard?.id === record.id) showNotice("This canvas is too large to save online, so it's only saved on this computer. Use Export image to keep a copy.");
    await writeLocal({ ...record, dirty: false, tooLarge: true });
    return true;
  }
  if (result.error === "notfound") {
    await removeLocal(record.id);
    return true;
  }
  if (!result.ok) return false;

  // Keeps the canvas marked unsaved if it changed while this upload was on its way.
  const latest = (currentBoard?.id === record.id ? currentBoard : await readLocal(record.id)) || record;
  const updated = { ...latest, baseUpdatedAt: result.updatedAt, dirty: latest.revision !== record.revision, conflict: false };
  if (currentBoard?.id === record.id) currentBoard = updated;
  await writeLocal(updated);
  return true;
}

async function markConflict(record) {
  await writeLocal({ ...record, conflict: true });
  if (currentBoard?.id !== record.id) return;
  currentBoard = { ...currentBoard, conflict: true };
  refreshSaveStatus();
  showNotice("This canvas was changed on another computer, so your changes here haven't been saved online.", [
    { label: "Keep this version", action: keepThisVersion },
    { label: "Load the other version", action: loadOtherVersion },
  ]);
}

async function keepThisVersion() {
  hideNotice();
  await flushSave();
  if (await uploadRecord(currentBoard, true)) refreshSaveStatus();
}

async function loadOtherVersion() {
  hideNotice();
  clearTimeout(saveTimer);
  savePending = false;
  const { id } = currentBoard;
  currentBoard = null;
  await removeLocal(id);
  route();
}

async function syncAll() {
  if (syncRunning || sessionEnded) return;
  syncRunning = true;
  refreshSaveStatus();
  let keepGoing = true;
  try {
    const waiting = (await allLocal()).filter((record) => record.dirty && !record.conflict);
    for (const stored of waiting) {
      const record = currentBoard?.id === stored.id ? currentBoard : stored;
      keepGoing = await uploadRecord(record, false);
      if (!keepGoing) break;
    }
    const remaining = (await allLocal()).filter((record) => record.dirty && !record.conflict);
    unsyncedCount = remaining.length;
    if (remaining.length && !sessionEnded) syncSoon(keepGoing ? SYNC_DELAY_MS : SYNC_RETRY_MS);
  } finally {
    syncRunning = false;
    refreshSaveStatus();
  }
}

/* Opening a canvas */

function applyBoard(record) {
  closeTextEditor(false);
  if (zoomAnimation) cancelAnimationFrame(zoomAnimation.frame);
  zoomAnimation = null;
  currentBoard = record;
  shapes = record.shapes;
  view = { ...record.view };
  background = record.background;
  element("stage").style.background = BACKGROUNDS[background].fill;
  undoStack = [];
  redoStack = [];
  selected = [];
  gesture = null;
  element("canvas-name").textContent = record.name;
  if (shapes.some((shape) => shape.hand)) loadHandFont();
  updateControls();
  resizeCanvases();
  refreshSaveStatus();
  performance.mark("board-ready");
}

function recordFromServer(board) {
  const data = board.data ? JSON.parse(board.data) : {};
  return {
    id: board.id,
    folderId: board.folderId,
    name: board.name,
    shapes: data.shapes || [],
    view: data.view || { x: 0, y: 0, zoom: 1 },
    background: data.background || "white",
    baseUpdatedAt: board.updatedAt,
    dirty: false,
    conflict: false,
    revision: 0,
  };
}

function showCanvasScreen() {
  element("library").hidden = true;
  element("library-bar").hidden = true;
  element("stage").hidden = false;
}

async function openCanvas(id, routeNumber) {
  const local = await readLocal(id);
  if (routeNumber !== latestRoute) return;
  if (local) {
    showCanvasScreen();
    applyBoard(local);
    // A disagreement between two computers stays unresolved until the admin chooses a version.
    if (local.conflict) await markConflict(local);
  } else {
    showLibraryScreen("Opening canvas...", "");
  }

  let result;
  try {
    result = await callBackend({ action: "adminBoardLoad", token: getAdminToken(), id });
  } catch (error) {
    if (!local && routeNumber === latestRoute) showLibraryProblem("We couldn't open this canvas. Please check your connection and try again.");
    return;
  }
  if (routeNumber !== latestRoute) return;
  if (result.error === "session") return handleEndedSession(Boolean(local));
  if (result.error === "notfound") {
    await removeLocal(id);
    currentBoard = null;
    location.hash = "";
    return;
  }
  if (!result.ok) {
    if (!local) showLibraryProblem("We couldn't open this canvas. Please try again.");
    return;
  }

  const fresh = recordFromServer(result.board);
  if (!local) {
    await writeLocal(fresh);
    if (routeNumber !== latestRoute) return;
    showCanvasScreen();
    applyBoard(fresh);
  } else if (currentBoard?.id === id) {
    currentBoard = { ...currentBoard, name: fresh.name, folderId: fresh.folderId };
    element("canvas-name").textContent = fresh.name;
    if (fresh.baseUpdatedAt !== currentBoard.baseUpdatedAt && !currentBoard.dirty && !savePending) {
      // Another computer saved a newer copy, and this one has nothing unsaved, so the newer copy is safe to show.
      await writeLocal(fresh);
      applyBoard(fresh);
    } else {
      await writeLocal(currentBoard);
    }
  }
}

function handleEndedSession(hasLocalCopy) {
  sessionEnded = true;
  if (!hasLocalCopy) {
    clearAdminToken();
    location.replace("admin.html");
    return;
  }
  refreshSaveStatus();
  showNotice("Your admin session has ended. Your work is safe on this computer.", [{ label: "Log in again", action: () => location.assign("admin.html") }]);
}

/* Folders and canvases */

function showLibraryScreen(title, summary) {
  currentBoard = null;
  closeMenu();
  hideNotice();
  element("stage").hidden = true;
  element("library-bar").hidden = false;
  element("library").hidden = false;
  element("library-title").textContent = title;
  element("library-summary").textContent = summary;
  element("library-problem").hidden = true;
  element("library-actions").replaceChildren();
  element("library-list").replaceChildren();
  element("library-back-row").hidden = true;
}

function showLibraryProblem(message) {
  element("library-summary").textContent = "";
  element("library-problem").textContent = message;
  element("library-problem").hidden = false;
}

async function callLibrary(params) {
  try {
    const result = await callBackend({ ...params, token: getAdminToken() });
    if (result.error === "session") {
      handleEndedSession(false);
      return null;
    }
    return result;
  } catch (error) {
    showLibraryProblem("We couldn't reach the server. Please check your connection and try again.");
    return null;
  }
}

function libraryButton(label, action, secondary = true) {
  const button = Object.assign(document.createElement("button"), { type: "button", className: `btn${secondary ? " secondary" : ""}`, textContent: label });
  button.addEventListener("click", action);
  return button;
}

function askName(message, current = "") {
  const name = prompt(message, current);
  return name && name.trim() ? name.trim() : null;
}

function countLabel(count, singular) {
  return `${count} ${singular}${count === 1 ? "" : "s"}`;
}

function renderFolders() {
  const { folders, boards } = library;
  showLibraryScreen("Teaching Boards", folders.length ? `${countLabel(folders.length, "folder")}, ${countLabel(boards.length, "canvas").replace("canvass", "canvases")}.` : "Create a folder to get started, such as Session 1.");
  element("library-actions").append(libraryButton("New folder", createFolder, false));
  element("library-list").replaceChildren(...folders.map((folder, index) => {
    const inside = boards.filter((board) => board.folderId === folder.id).length;
    const card = Object.assign(document.createElement("button"), { type: "button", className: "topic-card" });
    card.append(
      Object.assign(document.createElement("span"), { className: "topic-number", textContent: String(index + 1).padStart(2, "0") }),
      Object.assign(document.createElement("span"), { className: "topic-name", textContent: folder.name }),
      Object.assign(document.createElement("span"), { className: "badge submitted", textContent: countLabel(inside, "canvas").replace("canvass", "canvases") }),
    );
    card.addEventListener("click", () => { location.hash = `folder=${folder.id}`; });
    const item = document.createElement("li");
    item.append(card);
    return item;
  }));
}

function renderFolder(folder) {
  const inside = library.boards.filter((board) => board.folderId === folder.id);
  showLibraryScreen(folder.name, inside.length ? countLabel(inside.length, "canvas").replace("canvass", "canvases") : "This folder is empty.");
  element("library-back-row").hidden = false;
  element("library-actions").append(
    libraryButton("New canvas", () => createCanvas(folder), false),
    libraryButton("Rename folder", () => renameFolder(folder)),
    libraryButton("Delete folder", () => deleteFolder(folder, inside.length)),
  );
  element("library-list").replaceChildren(...inside.map((board, index) => {
    const card = Object.assign(document.createElement("button"), { type: "button", className: "topic-card" });
    card.append(
      Object.assign(document.createElement("span"), { className: "topic-number", textContent: String(index + 1).padStart(2, "0") }),
      Object.assign(document.createElement("span"), { className: "topic-name", textContent: board.name }),
      Object.assign(document.createElement("span"), { className: "badge open", textContent: `Saved ${new Date(board.updatedAt).toLocaleString()}` }),
    );
    card.addEventListener("click", () => { location.hash = `canvas=${board.id}`; });
    const actions = Object.assign(document.createElement("div"), { className: "canvas-item-actions" });
    for (const [label, action] of [["Rename", () => renameCanvas(board)], ["Delete", () => deleteCanvas(board)]]) {
      const button = Object.assign(document.createElement("button"), { type: "button", className: "text-button", textContent: label });
      button.setAttribute("aria-label", `${label} ${board.name}`);
      button.addEventListener("click", action);
      actions.append(button);
    }
    const item = Object.assign(document.createElement("li"), { className: "canvas-item" });
    item.append(card, actions);
    return item;
  }));
}

async function loadLibrary(routeNumber) {
  showLibraryScreen("Teaching Boards", "Loading...");
  const result = await callLibrary({ action: "adminBoards" });
  if (!result || routeNumber !== latestRoute) return false;
  if (!result.ok) {
    showLibraryProblem("We couldn't load your folders. Please try again.");
    return false;
  }
  library = { folders: result.folders, boards: result.boards };
  return true;
}

function reportLibraryError(result) {
  showLibraryProblem(result.error === "notempty"
    ? "Delete or empty this folder's canvases first."
    : "We couldn't make that change. Please try again.");
}

async function createFolder() {
  const name = askName("Name for the new folder, such as Session 1");
  if (!name) return;
  const result = await callLibrary({ action: "adminFolderCreate", name });
  if (!result) return;
  if (!result.ok) return reportLibraryError(result);
  location.hash = `folder=${result.folder.id}`;
}

async function renameFolder(folder) {
  const name = askName("New name for this folder", folder.name);
  if (!name) return;
  const result = await callLibrary({ action: "adminFolderRename", id: folder.id, name });
  if (!result) return;
  if (!result.ok) return reportLibraryError(result);
  route();
}

async function deleteFolder(folder, canvasCount) {
  if (canvasCount) return showLibraryProblem(`Delete this folder's ${countLabel(canvasCount, "canvas").replace("canvass", "canvases")} first.`);
  if (!confirm(`Delete the folder "${folder.name}"?`)) return;
  const result = await callLibrary({ action: "adminFolderDelete", id: folder.id });
  if (!result) return;
  if (!result.ok) return reportLibraryError(result);
  location.hash = "";
}

async function createCanvas(folder) {
  const name = askName("Name for the new canvas", `Canvas ${library.boards.filter((board) => board.folderId === folder.id).length + 1}`);
  if (!name) return;
  const result = await callLibrary({ action: "adminBoardCreate", folderId: folder.id, name });
  if (!result) return;
  if (!result.ok) return reportLibraryError(result);
  location.hash = `canvas=${result.board.id}`;
}

async function renameCanvas(board) {
  const name = askName("New name for this canvas", board.name);
  if (!name) return;
  const result = await callLibrary({ action: "adminBoardRename", id: board.id, name });
  if (!result) return;
  if (!result.ok) return reportLibraryError(result);
  const local = await readLocal(board.id);
  if (local) await writeLocal({ ...local, name });
  route();
}

async function deleteCanvas(board) {
  if (!confirm(`Delete the canvas "${board.name}"? This can't be undone.`)) return;
  const result = await callLibrary({ action: "adminBoardDelete", id: board.id });
  if (!result) return;
  if (!result.ok) return reportLibraryError(result);
  await removeLocal(board.id);
  route();
}

element("library-back").addEventListener("click", () => { location.hash = ""; });

element("to-folder").addEventListener("click", async () => {
  closeMenu();
  await flushSave();
  syncSoon(0);
  location.hash = `folder=${currentBoard.folderId}`;
});

element("rename-board").addEventListener("click", async () => {
  closeMenu();
  const name = askName("New name for this canvas", currentBoard.name);
  if (!name) return;
  try {
    const result = await callBackend({ action: "adminBoardRename", token: getAdminToken(), id: currentBoard.id, name });
    if (!result.ok) throw new Error(result.error);
  } catch (error) {
    return showNotice("We couldn't rename this canvas. Please check your connection and try again.");
  }
  currentBoard = { ...currentBoard, name };
  element("canvas-name").textContent = name;
  await writeLocal(currentBoard);
});

/* Moving between screens */

async function route() {
  const routeNumber = ++latestRoute;
  await flushSave();
  if (routeNumber !== latestRoute) return;
  currentBoard = null;
  const [kind, id] = location.hash.slice(1).split("=");
  if (kind === "canvas" && id) return openCanvas(id, routeNumber);
  if (!(await loadLibrary(routeNumber))) return;
  const folder = kind === "folder" ? library.folders.find((item) => item.id === id) : null;
  if (folder) renderFolder(folder);
  else renderFolders();
  element("library-title").focus({ preventScroll: true });
}

window.addEventListener("hashchange", route);

/* Saving an image and presenting */

element("export").addEventListener("click", async () => {
  closeMenu();
  if (!shapes.length) return showNotice("This board is empty, so there's nothing to save yet.");
  element("board-notice").hidden = true;
  const all = shapes.map(boundsOf);
  const left = Math.min(...all.map((bounds) => bounds[0])) - EXPORT_PADDING;
  const top = Math.min(...all.map((bounds) => bounds[1])) - EXPORT_PADDING;
  const width = Math.max(...all.map((bounds) => bounds[2])) + EXPORT_PADDING - left;
  const height = Math.max(...all.map((bounds) => bounds[3])) + EXPORT_PADDING - top;
  const scale = Math.min(2, MAX_EXPORT_SIZE / width, MAX_EXPORT_SIZE / height);
  const canvas = Object.assign(document.createElement("canvas"), { width: Math.ceil(width * scale), height: Math.ceil(height * scale) });
  const context = canvas.getContext("2d");
  context.fillStyle = BACKGROUNDS[background].fill;
  context.fillRect(0, 0, canvas.width, canvas.height);
  context.setTransform(scale, 0, 0, scale, -left * scale, -top * scale);
  // Images that are off screen may not have finished loading yet.
  await Promise.all(shapes.filter((shape) => shape.type === "image").map((shape) => imageFor(shape.src)?.decode().catch(() => {})));
  shapes.forEach((shape) => drawShape(context, shape));
  canvas.toBlob((blob) => {
    const link = Object.assign(document.createElement("a"), {
      href: URL.createObjectURL(blob),
      download: `${currentBoard.name.replace(/[^\w -]+/g, "").trim() || "board"}.png`,
    });
    link.click();
    URL.revokeObjectURL(link.href);
  });
});

element("present").addEventListener("click", () => {
  closeMenu();
  if (document.fullscreenElement) {
    document.exitFullscreen();
    return;
  }
  document.documentElement.requestFullscreen().catch(() => {
    showNotice("Your browser blocked full screen. Try pressing F11 instead.");
  });
});
document.addEventListener("fullscreenchange", () => {
  element("present").textContent = document.fullscreenElement ? "Exit full screen" : "Full screen";
});

window.addEventListener("pagehide", () => {
  finishZoom();
  flushSave();
});
window.addEventListener("beforeunload", (event) => {
  if (savePending || unsyncedCount) event.preventDefault();
});
window.addEventListener("online", () => syncSoon(0));
new ResizeObserver(resizeCanvases).observe(element("stage"));

async function start() {
  buildToolbar();
  controlButtons.tools.convert.hidden = true;
  setTool("pen");
  try {
    database = await openDatabase();
  } catch (error) {
    database = null;
    showNotice("This browser is blocking storage on this computer, so changes only save online while you're connected.");
  }
  syncSoon(0);
  route();
  restoreHandChoice();
}

function restoreHandChoice() {
  try {
    if (localStorage.getItem(HAND_KEY) === "on") element("hand-toggle").click();
  } catch (error) {
    // The switch starts off when this browser blocks storage.
  }
}

if (getAdminToken()) start();
</script>
